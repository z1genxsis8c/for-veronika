<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎮 Котик-прыгун</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff4d6d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Котик-прыгун">
  <link rel="apple-touch-icon" href="photos/icon-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
      display: flex; flex-direction: column; align-items: center;
      padding: 12px; height: 100vh;
    }

    body.night {
      background: linear-gradient(135deg, #1a0a2e, #2b0a1f);
    }

    .game-container {
      width: 100%; max-width: 620px;
      text-align: center;
      display: flex; flex-direction: column;
      height: 100%;
    }

    .game-title {
      color: #ff4d6d; font-size: 22px; font-weight: 800;
      margin: 0 0 4px;
      text-shadow: 0 2px 10px rgba(255,255,255,0.9);
    }
    body.night .game-title { color: #ffb3c1; }

    .game-subtitle {
      color: #c71585; font-size: 13px; font-weight: 600;
      margin: 0 0 10px; font-style: italic;
    }
    body.night .game-subtitle { color: #ff8fa3; }

    .game-score-row {
      display: flex; justify-content: center;
      gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
    }

    .game-score-chip {
      background: rgba(255,255,255,0.95);
      border: 2px solid #ffc2d1; border-radius: 50px;
      padding: 6px 14px; font-size: 12px; font-weight: 700;
      color: #c71585;
      box-shadow: 0 4px 12px rgba(255,77,109,0.2);
    }
    .game-score-chip b { color: #ff4d6d; }

    .game-canvas-wrap {
      position: relative; width: 100%;
      flex: 1;
      background: linear-gradient(180deg, #fff5f8, #ffe5ec);
      border-radius: 20px; border: 3px solid #fff;
      box-shadow: 0 10px 40px rgba(255,77,109,0.3);
      overflow: hidden; margin-bottom: 10px;
      min-height: 300px;
    }

    #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .powerup-indicator {
      position: absolute; top: 12px; right: 12px;
      background: linear-gradient(135deg, #ffd700, #ffa500);
      color: #fff; padding: 6px 14px; border-radius: 50px;
      font-size: 13px; font-weight: 800;
      box-shadow: 0 4px 15px rgba(255,165,0,0.6);
      display: none; align-items: center; gap: 4px;
      animation: pulsePowerup 0.7s ease-in-out infinite;
      z-index: 10;
    }
    .powerup-indicator.active { display: flex; }
    @keyframes pulsePowerup {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .game-pause-box {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.95);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 5; padding: 20px;
      border-radius: 17px;
    }
    .game-pause-box.show { display: flex; }
    .game-pause-box h3 { color: #ff4d6d; font-size: 20px; margin: 0 0 12px; }
    .pause-emoji {
      font-size: 50px; margin-bottom: 8px;
      animation: heartbeat 1.5s infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
    }

    .game-controls {
      display: flex; gap: 10px;
      justify-content: center; flex-wrap: wrap;
    }

    .game-hint {
      color: #c71585; font-size: 12px;
      font-weight: 700; margin-top: 6px; opacity: 0.8;
    }
    body.night .game-hint { color: #ff8fa3; }

    .btn {
      background: rgba(255,255,255,0.95);
      color: #c71585; border: 2px solid #ffc2d1;
      font-size: 14px; padding: 10px 20px;
      text-decoration: none; border-radius: 50px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(255,77,109,0.2);
      transition: all 0.25s; cursor: pointer;
      font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: #ff4d6d; color: white; border-color: #ff4d6d; transform: translateY(-2px); }
    .btn.primary { background: linear-gradient(135deg, #ff4d6d, #c71585); color: white; border-color: #ff4d6d; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    @keyframes floatUpScore {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0; }
    }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #ff4d6d, #c71585);
      color: #fff; padding: 12px 22px;
      border-radius: 50px; font-size: 14px; font-weight: 700;
      box-shadow: 0 12px 32px rgba(199,21,133,0.5);
      z-index: 3000; opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .float-heart {
      position: fixed; font-size: 20px;
      pointer-events: none; z-index: 5000;
      animation: floatUp 1.5s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h2 class="game-title">🎮 Котик-прыгун</h2>
    <p class="game-subtitle" id="gameSubtitle">Прыгай через препятствия и собирай рыбки! 🐟</p>

    <div class="game-score-row">
      <div class="game-score-chip">Очки: <b id="gameScore">0</b></div>
      <div class="game-score-chip">Рекорд: <b id="gameRecord">0</b></div>
      <div class="game-score-chip">🪙 +<b id="gameCoins">0</b></div>
      <div class="game-score-chip">🐟 +<b id="gameFishes">0</b></div>
    </div>

    <div class="game-canvas-wrap" id="gameCanvasWrap">
      <div class="powerup-indicator" id="powerupIndicator">
        ⚡ ×2 ×<span id="powerupTimer">10</span>с
      </div>
      <canvas id="gameCanvas"></canvas>
      <div class="game-pause-box" id="gameOverBox">
        <div class="pause-emoji" id="goEmoji">😿</div>
        <h3 id="goTitle">Ой, котик упал!</h3>
        <p style="color:#c71585; font-size:14px; font-weight:700; margin:4px 0;">Результат:</p>
        <div style="font-size:32px; font-weight:900; color:#ff4d6d; margin:4px 0 12px;" id="goScore">0</div>
        <div style="color:#c71585; font-size:12px; font-weight:700; margin-bottom:14px;" id="goRecord">Рекорд: 0</div>
        <div style="color:#ffa500; font-size:13px; font-weight:800; margin-bottom:6px;" id="goCoins">+0 монеток</div>
        <div style="color:#4caf50; font-size:13px; font-weight:800; margin-bottom:14px;" id="goFish">+0 🐟</div>
        <button class="btn primary" onclick="restartGame()">🔄 Играть снова</button>
      </div>
    </div>

    <div class="game-controls">
      <button class="btn primary" onclick="startGame()" id="startBtn">▶ Начать</button>
      <a href="cat.html" class="btn">← К котику</a>
    </div>

    <div class="game-hint">
      💡 ПРОБЕЛ или тапни, чтобы прыгнуть • Собирай 🐟 • Лови ⚡ ×2
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ═══════════════════════════════════════════
    // ЗВУКИ
    // ═══════════════════════════════════════════
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
      }
    }
    function playTone(frequency, duration, type = 'sine', volume = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch {}
    }
    const Sound = {
      jump: () => { playTone(440, 0.1, 'square', 0.1); setTimeout(() => playTone(660, 0.1, 'square', 0.08), 50); },
      fish: () => { playTone(880, 0.12, 'sine', 0.15); setTimeout(() => playTone(1320, 0.15, 'sine', 0.12), 60); },
      hurt: () => { playTone(220, 0.3, 'sawtooth', 0.15); setTimeout(() => playTone(140, 0.4, 'sawtooth', 0.12), 100); },
      powerup: () => { playTone(660, 0.1, 'sine', 0.15); setTimeout(() => playTone(880, 0.1, 'sine', 0.15), 80); setTimeout(() => playTone(1320, 0.2, 'sine', 0.15), 160); },
      coin: () => { playTone(1200, 0.08, 'sine', 0.12); setTimeout(() => playTone(1600, 0.12, 'sine', 0.1), 50); },
      ach: () => { playTone(660, 0.15, 'sine', 0.15); setTimeout(() => playTone(880, 0.15, 'sine', 0.15), 100); setTimeout(() => playTone(1100, 0.25, 'sine', 0.15), 200); }
    };

    // ═══════════════════════════════════════════
    // СОСТОЯНИЕ (общее с cat.html)
    // ═══════════════════════════════════════════
    const DEFAULT_STATE = {
      hunger: 50, mood: 60, affection: 50,
      sleeping: false, coins: 0,
      ownedHats: [], ownedFood: {},
      fishCollected: 0, equippedHat: null,
      achievements: [], totalFishCollected: 0,
      lastUpdate: Date.now()
    };

    let catState = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem('catState');
        if (!saved) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const raw = JSON.parse(saved);
        const state = { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...raw };

        if (raw.ownedItems && !raw.ownedHats) {
          state.ownedHats = raw.ownedItems.filter(id => typeof id === 'string' && id.startsWith('hat_'));
        }
        if (raw.equipped && raw.equipped.hat && !raw.equippedHat) {
          state.equippedHat = raw.equipped.hat;
        }

        state.ownedHats = Array.isArray(state.ownedHats) ? state.ownedHats : [];
        state.ownedFood = (typeof state.ownedFood === 'object' && state.ownedFood) ? state.ownedFood : {};
        state.achievements = Array.isArray(state.achievements) ? state.achievements : [];

        if (state.equippedHat && !state.ownedHats.includes(state.equippedHat)) {
          state.equippedHat = null;
        }

        const now = Date.now();
        const elapsed = Math.floor((now - (state.lastUpdate || now)) / 1000 / 30);
        state.hunger = Math.max(0, state.hunger - elapsed * 2);
        state.mood = Math.max(0, state.mood - elapsed * 1);
        state.lastUpdate = now;
        return state;
      } catch (e) {
        console.error('loadState error:', e);
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      catState.lastUpdate = Date.now();
      try { localStorage.setItem('catState', JSON.stringify(catState)); } catch {}
    }

    const ACHIEVEMENTS = [
      { id: 'first_record', icon: '🥇', title: 'Первый рекорд', desc: 'Поставь свой первый рекорд в игре' },
      { id: 'hundred', icon: '💯', title: '100 очков', desc: 'Набери 100 очков в мини-игре' },
      { id: 'ten_fish', icon: '🐟', title: 'Собрал 10 рыбок', desc: 'Поймай 10 рыбок за всё время' },
      { id: 'first_buy', icon: '🛍️', title: 'Первая покупка', desc: 'Купи что-нибудь в магазине' },
      { id: 'max_hunger', icon: '🍖', title: 'Сыт по горло', desc: 'Покорми котика до 100% сытости' },
      { id: 'level_master', icon: '🌈', title: 'Путешественник', desc: 'Пройди через 3 разных уровня' },
      { id: 'sky_high', icon: '☁️', title: 'Небесный кот', desc: 'Набери 500 высоты в Doodle' }
    ];

    function unlockAchievement(id) {
      if (catState.achievements.includes(id)) return;
      catState.achievements.push(id);
      saveState();
      const ach = ACHIEVEMENTS.find(a => a.id === id);
      if (ach) {
        showToast(`🏆 Достижение: ${ach.title}!`);
        Sound.ach();
        spawnHearts(10);
      }
    }

    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function spawnHearts(count) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'float-heart';
          heart.textContent = ['💗','💖','❤️','💕','✨'][Math.floor(Math.random()*5)];
          heart.style.left = (cx + (Math.random()*60 - 30)) + 'px';
          heart.style.top = cy + 'px';
          heart.style.fontSize = (16 + Math.random()*12) + 'px';
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 1500);
        }, i * 80);
      }
    }

    function applyNightMode() {
      const hour = new Date().getHours();
      const isRealNight = hour >= 22 || hour < 7;
      document.body.classList.toggle('night', isRealNight);
    }
    applyNightMode();

    // ═══════════════════════════════════════════
    // ИГРА
    // ═══════════════════════════════════════════
    const gameCanvas = document.getElementById('gameCanvas');
    const gameCanvasWrap = document.getElementById('gameCanvasWrap');
    const gctx = gameCanvas.getContext('2d');
    const gameScoreEl = document.getElementById('gameScore');
    const gameRecordEl = document.getElementById('gameRecord');
    const gameCoinsEl = document.getElementById('gameCoins');
    const gameFishesEl = document.getElementById('gameFishes');
    const gameOverBox = document.getElementById('gameOverBox');
    const goScoreEl = document.getElementById('goScore');
    const goRecordEl = document.getElementById('goRecord');
    const goCoinsEl = document.getElementById('goCoins');
    const goFishEl = document.getElementById('goFish');
    const goTitleEl = document.getElementById('goTitle');
    const goEmojiEl = document.getElementById('goEmoji');
    const startBtn = document.getElementById('startBtn');
    const powerupIndicator = document.getElementById('powerupIndicator');
    const powerupTimerEl = document.getElementById('powerupTimer');
    const gameSubtitle = document.getElementById('gameSubtitle');

    const LEVELS = [
      { name: '🌳 Лес', sky: ['#e8f5e9','#c8e6c9'], ground: '#8bc34a', obstacle: ['🌵','🌳','🌲','🍄'], cloud: true, stars: false },
      { name: '🌃 Ночной город', sky: ['#1a1a3e','#2a1a5e'], ground: '#4a4a6a', obstacle: ['🏢','🚗','🚦','🛢️'], cloud: false, stars: true },
      { name: '🏖️ Пляж', sky: ['#fff9c4','#ffe082'], ground: '#f4d58d', obstacle: ['🐚','🌴','⛱️','🦀'], cloud: true, stars: false }
    ];

    let currentLevel = 0;
    function getLevelIndexByScore(score) { return Math.min(LEVELS.length - 1, Math.floor(score / 200)); }

    let game = {
      running: false, finished: false,
      score: 0,
      record: parseInt(localStorage.getItem('catGameRecord') || '0'),
      speed: 4, gravity: 0.7, jumpPower: -13,
      groundY: 0,
      cat: null,
      obstacles: [], fishes: [], powerups: [], clouds: [], stars: [],
      lastObstacleTime: 0, lastPowerupTime: 0,
      frame: 0,
      doubleScore: false, doubleScoreEndTime: 0,
      coinsThisRun: 0, fishThisRun: 0,
      nextCoinScore: 100,
      levelsSeen: new Set()
    };

    gameRecordEl.textContent = game.record;

    function resizeGameCanvas() {
      const wrap = gameCanvas.parentElement;
      const rect = wrap.getBoundingClientRect();
      const oldGroundY = game.groundY;
      gameCanvas.width = rect.width;
      gameCanvas.height = rect.height;
      game.groundY = rect.height - 40;

      if (game.cat) {
        if (game.cat.onGround) {
          game.cat.y = game.groundY - game.cat.height;
        } else if (oldGroundY) {
          game.cat.y += (game.groundY - oldGroundY);
        }
      }
    }

    function initGameObjects() {
      const W = gameCanvas.width;
      game.cat = { x: 60, y: game.groundY - 40, width: 44, height: 44, vy: 0, onGround: true };
      game.obstacles = [];
      game.fishes = [];
      game.powerups = [];
      game.clouds = [];
      game.stars = [];

      for (let i = 0; i < 4; i++) {
        game.clouds.push({ x: Math.random()*W, y: 20 + Math.random()*60, speed: 0.3 + Math.random()*0.4, size: 30 + Math.random()*20 });
      }
      for (let i = 0; i < 30; i++) {
        game.stars.push({ x: Math.random()*W, y: Math.random()*(game.groundY - 20), size: Math.random()*1.5 + 0.5 });
      }

      game.lastObstacleTime = Date.now();
      game.lastPowerupTime = Date.now();
      game.frame = 0;
      game.doubleScore = false;
      powerupIndicator.classList.remove('active');
      game.nextCoinScore = 100;
      game.levelsSeen = new Set([0]);
      currentLevel = 0;
    }

    function jump() {
      if (!game.running || !game.cat) return;
      if (game.cat.onGround) {
        game.cat.vy = game.jumpPower;
        game.cat.onGround = false;
        Sound.jump();
      }
    }

    function updateGame() {
      if (!game.running || !game.cat) return;
      const W = gameCanvas.width;

      game.cat.vy += game.gravity;
      game.cat.y += game.cat.vy;
      if (game.cat.y >= game.groundY - game.cat.height) {
        game.cat.y = game.groundY - game.cat.height;
        game.cat.vy = 0;
        game.cat.onGround = true;
      }

      game.clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x + c.size < 0) { c.x = W + c.size; c.y = 20 + Math.random()*60; }
      });

      if (game.doubleScore && Date.now() > game.doubleScoreEndTime) {
        game.doubleScore = false;
        powerupIndicator.classList.remove('active');
      }
      if (game.doubleScore) {
        const left = Math.max(0, Math.ceil((game.doubleScoreEndTime - Date.now()) / 1000));
        powerupTimerEl.textContent = left;
      }

      const now = Date.now();
      const obstacleDelay = Math.max(1300, 1800 - game.score * 6);
      if (now - game.lastObstacleTime > obstacleDelay) {
        game.lastObstacleTime = now;
        const level = LEVELS[currentLevel];
        const type = level.obstacle[Math.floor(Math.random() * level.obstacle.length)];
        const h = 30 + Math.random() * 20;

        const lastObs = game.obstacles[game.obstacles.length - 1];
        if (!(lastObs && (W + 20 - lastObs.x) < 250)) {
          const obsX = W + 20;
          game.obstacles.push({ x: obsX, y: game.groundY - h, width: 30, height: h, emoji: type });
          if (Math.random() < 0.6) {
            game.fishes.push({ x: obsX + 10, y: game.groundY - h - 60, size: 26, collected: false, bobPhase: Math.random()*Math.PI*2 });
          }
        }
      }

      if (now - game.lastPowerupTime > 15000 + Math.random()*15000) {
        game.lastPowerupTime = now;
        game.powerups.push({ x: W + 20, y: game.groundY - 80 - Math.random()*30, size: 30, collected: false, bobPhase: 0 });
      }

      game.obstacles.forEach(o => o.x -= game.speed);
      game.obstacles = game.obstacles.filter(o => o.x + o.width > -20);
      game.fishes.forEach(f => { f.x -= game.speed; f.bobPhase += 0.15; });
      game.fishes = game.fishes.filter(f => f.x + f.size > -20);
      game.powerups.forEach(p => { p.x -= game.speed; p.bobPhase += 0.2; });
      game.powerups = game.powerups.filter(p => p.x + p.size > -20);

      const catBox = { x: game.cat.x + 6, y: game.cat.y + 6, w: game.cat.width - 12, h: game.cat.height - 8 };
      for (const o of game.obstacles) {
        if (catBox.x < o.x + o.width && catBox.x + catBox.w > o.x && catBox.y < o.y + o.height && catBox.y + catBox.h > o.y) {
          endGame(); return;
        }
      }

      for (const f of game.fishes) {
        if (!f.collected) {
          const dx = (game.cat.x + game.cat.width/2) - (f.x + f.size/2);
          const dy = (game.cat.y + game.cat.height/2) - (f.y + f.size/2);
          if (Math.sqrt(dx*dx + dy*dy) < 38) {
            f.collected = true;
            const points = game.doubleScore ? 10 : 5;
            game.score += points;
            game.fishThisRun++;
            gameScoreEl.textContent = game.score;
            gameFishesEl.textContent = game.fishThisRun;
            catState.totalFishCollected++;
            showFloatingScore(f.x, f.y, `+${points}`, '#ff4d6d');
            Sound.fish();
            if (catState.totalFishCollected >= 10) unlockAchievement('ten_fish');
          }
        }
      }
      game.fishes = game.fishes.filter(f => !f.collected);

      for (const p of game.powerups) {
        if (!p.collected) {
          const dx = (game.cat.x + game.cat.width/2) - (p.x + p.size/2);
          const dy = (game.cat.y + game.cat.height/2) - (p.y + p.size/2);
          if (Math.sqrt(dx*dx + dy*dy) < 38) {
            p.collected = true;
            game.doubleScore = true;
            game.doubleScoreEndTime = Date.now() + 10000;
            powerupIndicator.classList.add('active');
            powerupTimerEl.textContent = '10';
            showFloatingScore(p.x, p.y, '⚡ ×2!', '#ffa500');
            Sound.powerup();
            spawnHearts(8);
          }
        }
      }
      game.powerups = game.powerups.filter(p => !p.collected);

      game.frame++;
      if (game.frame % 6 === 0) {
        const points = game.doubleScore ? 2 : 1;
        game.score += points;
        gameScoreEl.textContent = game.score;
        while (game.score >= game.nextCoinScore) {
          game.nextCoinScore += 100;
          game.coinsThisRun += 10;
          gameCoinsEl.textContent = game.coinsThisRun;
          Sound.coin();
          showFloatingScore(gameCanvas.width - 80, 40, '🪙 +10', '#ffa500');
        }
      }

      const newLevel = getLevelIndexByScore(game.score);
      if (newLevel !== currentLevel) {
        currentLevel = newLevel;
        game.levelsSeen.add(newLevel);
        gameSubtitle.textContent = `Достигнут уровень: ${LEVELS[currentLevel].name}`;
        showToast(`🌈 Новый уровень: ${LEVELS[currentLevel].name}`);
        setTimeout(() => { gameSubtitle.textContent = 'Прыгай через препятствия и собирай рыбки! 🐟'; }, 3000);
        if (game.levelsSeen.size >= 3) unlockAchievement('level_master');
      }

      game.speed = 4 + Math.min(6, game.score * 0.03);
    }

    function showFloatingScore(x, y, text, color) {
      if (!gameCanvasWrap) return;
      const el = document.createElement('div');
      el.textContent = text;
      el.style.cssText = `position:absolute;left:${x}px;top:${y}px;color:${color};font-weight:800;font-size:18px;pointer-events:none;z-index:100;animation:floatUpScore 0.9s ease-out forwards;`;
      gameCanvasWrap.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function drawGame() {
      const W = gameCanvas.width;
      const H = gameCanvas.height;
      const level = LEVELS[currentLevel];

      const grad = gctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, level.sky[0]);
      grad.addColorStop(1, level.sky[1]);
      gctx.fillStyle = grad;
      gctx.fillRect(0, 0, W, H);

      if (currentLevel === 1) {
        gctx.fillStyle = '#fff';
        gctx.beginPath(); gctx.arc(W - 60, 50, 22, 0, Math.PI*2); gctx.fill();
        gctx.fillStyle = level.sky[0];
        gctx.beginPath(); gctx.arc(W - 68, 45, 20, 0, Math.PI*2); gctx.fill();
      } else {
        gctx.fillStyle = '#ffeb3b';
        gctx.beginPath(); gctx.arc(W - 60, 50, 22, 0, Math.PI*2); gctx.fill();
      }

      if (level.stars) {
        gctx.fillStyle = '#fff';
        game.stars.forEach(s => {
          gctx.globalAlpha = 0.5 + Math.sin(game.frame*0.05 + s.x)*0.5;
          gctx.beginPath(); gctx.arc(s.x, s.y, s.size, 0, Math.PI*2); gctx.fill();
        });
        gctx.globalAlpha = 1;
      }

      if (level.cloud) {
        gctx.fillStyle = 'rgba(255,255,255,0.85)';
        game.clouds.forEach(c => {
          gctx.beginPath();
          gctx.arc(c.x, c.y, c.size*0.6, 0, Math.PI*2);
          gctx.arc(c.x + c.size*0.5, c.y - c.size*0.2, c.size*0.5, 0, Math.PI*2);
          gctx.arc(c.x + c.size, c.y, c.size*0.55, 0, Math.PI*2);
          gctx.fill();
        });
      }

      gctx.fillStyle = level.ground;
      gctx.fillRect(0, game.groundY, W, H - game.groundY);

      gctx.strokeStyle = 'rgba(0,0,0,0.2)';
      gctx.lineWidth = 2;
      gctx.beginPath(); gctx.moveTo(0, game.groundY); gctx.lineTo(W, game.groundY); gctx.stroke();

      gctx.font = '30px serif';
      gctx.textAlign = 'center';
      gctx.textBaseline = 'bottom';
      game.obstacles.forEach(o => gctx.fillText(o.emoji, o.x + o.width/2, o.y + o.height));

      gctx.font = '26px serif';
      game.fishes.forEach(f => {
        const bob = Math.sin(f.bobPhase) * 4;
        gctx.fillText('🐟', f.x + f.size/2, f.y + f.size + bob);
      });

      gctx.font = '28px serif';
      game.powerups.forEach(p => {
        const bob = Math.sin(p.bobPhase) * 5;
        gctx.fillText('⚡', p.x + p.size/2, p.y + p.size + bob);
      });

      const cat = game.cat;
      if (!cat) return;

      gctx.save();
      gctx.fillStyle = 'rgba(0,0,0,0.15)';
      gctx.beginPath();
      gctx.ellipse(cat.x + cat.width/2, game.groundY + 3, cat.width/2.5, 5, 0, 0, Math.PI*2);
      gctx.fill();
      gctx.restore();

      gctx.save();
      gctx.fillStyle = '#000';
      gctx.font = '44px serif';
      gctx.textAlign = 'left';
      gctx.textBaseline = 'top';
      gctx.fillText(cat.onGround ? '🐱' : '😸', cat.x, cat.y);
      gctx.restore();
    }

    function gameLoop() {
      if (!game.running && !game.finished) return;
      if (!game.cat || !gameCanvas) return;
      updateGame();
      drawGame();
      if (game.running) requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      resizeGameCanvas();
      initGameObjects();
      game.running = true;
      game.finished = false;
      game.score = 0;
      game.speed = 4;
      game.coinsThisRun = 0;
      game.fishThisRun = 0;
      game.nextCoinScore = 100;
      gameScoreEl.textContent = '0';
      gameCoinsEl.textContent = '0';
      gameFishesEl.textContent = '0';
      gameRecordEl.textContent = game.record;
      gameOverBox.classList.remove('show');
      startBtn.disabled = true;
      startBtn.textContent = '🎮 Играем...';
      gameLoop();
    }

    function endGame() {
      game.running = false;
      game.finished = true;
      Sound.hurt();

      catState.coins += game.coinsThisRun;
      catState.fishCollected += game.fishThisRun;
      saveState();

      let isNewRecord = false;
      if (game.score > game.record) {
        game.record = game.score;
        localStorage.setItem('catGameRecord', game.record);
        gameRecordEl.textContent = game.record;
        isNewRecord = true;
      }

      if (game.score > 0) unlockAchievement('first_record');
      if (game.score >= 100) unlockAchievement('hundred');

      goScoreEl.textContent = game.score;
      goRecordEl.textContent = 'Рекорд: ' + game.record;
      goCoinsEl.textContent = `+${game.coinsThisRun} 🪙 заработано`;
      goFishEl.textContent = `+${game.fishThisRun} 🐟 поймано (всего ${catState.fishCollected})`;

      if (isNewRecord) {
        goEmojiEl.textContent = '🏆';
        goTitleEl.textContent = 'Новый рекорд!';
      } else {
        goEmojiEl.textContent = '😿';
        goTitleEl.textContent = 'Ой, котик упал!';
      }

      gameOverBox.classList.add('show');
      startBtn.disabled = false;
      startBtn.textContent = '▶ Начать';
      if (isNewRecord && game.score > 0) spawnHearts(20);
    }

    function restartGame() {
      gameOverBox.classList.remove('show');
      game.finished = false;
      startGame();
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (game.running) jump();
        else if (!game.finished) startGame();
      }
    });

    gameCanvas.addEventListener('click', () => { if (game.running) jump(); });
    gameCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (game.running) jump();
    }, { passive: false });

    window.addEventListener('resize', () => resizeGameCanvas());

    // Стартуем автоматически при загрузке
    window.addEventListener('load', () => {
      setTimeout(() => {
        resizeGameCanvas();
        initGameObjects();
        drawGame();
      }, 50);
    });

    // Сохранение при уходе со страницы
window.addEventListener('beforeunload', () => {
  if (game.coinsThisRun > 0 || game.fishThisRun > 0) {
    catState.coins += game.coinsThisRun;
    catState.fishCollected += game.fishThisRun;
    saveState();
  }
});

// Также сохраняем при переходе по ссылке "К котику"
document.querySelectorAll('a[href="cat.html"]').forEach(a => {
  a.addEventListener('click', () => {
    if (game.coinsThisRun > 0 || game.fishThisRun > 0) {
      catState.coins += game.coinsThisRun;
      catState.fishCollected += game.fishThisRun;
      saveState();
    }
  });
});
  </script>
</body>
