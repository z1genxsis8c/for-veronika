<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Наши даты · Для Вероники</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f3ede4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Вероника" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" href="photos/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ============================================================
       TOKENS
       ============================================================ */
      :root {
        --paper: #f3ede4;
        --paper-2: #ece4d8;
        --surface: #fdfaf6;
        --surface-2: #f7f0e6;
        --surface-3: #efe7da;

        --ink: #1e1a16;
        --ink-2: #4a423c;
        --ink-3: #8a7f75;
        --ink-4: #b8aca1;

        --line: rgba(30, 26, 22, 0.08);
        --line-2: rgba(30, 26, 22, 0.16);

        --rose: #b58794;
        --rose-deep: #8f6472;
        --rose-soft: #e8d4d8;
        --rose-tint: #f2e4e7;

        --sand: #cfb8a3;

        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
        line-height: 1.5;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        -webkit-tap-highlight-color: transparent;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 90% 60% at 15% -10%,
            rgba(232, 212, 216, 0.55),
            transparent 55%
          ),
          radial-gradient(
            ellipse 60% 50% at 95% 15%,
            rgba(207, 184, 163, 0.28),
            transparent 55%
          ),
          radial-gradient(
            ellipse 70% 55% at 5% 105%,
            rgba(181, 135, 148, 0.16),
            transparent 60%
          ),
          var(--paper);
      }

      .grain {
        position: fixed;
        inset: 0;
        z-index: 9998;
        pointer-events: none;
        opacity: 0.3;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 0 0.4 0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      img {
        max-width: 100%;
        display: block;
      }

      ::selection {
        background: var(--rose-soft);
        color: var(--rose-deep);
      }

      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(30, 26, 22, 0.12);
        border-radius: 10px;
        border: 3px solid var(--paper);
      }

      /* ============================================================
       TOP BAR
       ============================================================ */
      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 32px;
        background: rgba(243, 237, 228, 0.78);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border-bottom: 1px solid var(--line);
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 50%;
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 17px;
        line-height: 1;
        color: var(--ink);
        padding-bottom: 2px;
        transition: transform 0.4s var(--ease-spring);
      }

      .brand:hover .brand-mark {
        transform: rotate(-12deg) scale(1.05);
      }

      .brand-label {
        color: var(--ink-2);
        font-weight: 500;
      }

      .topbar-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink-2);
        cursor: pointer;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        transition: color 0.2s;
      }

      .topbar-meta:hover {
        color: var(--ink);
      }

      .meta-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .meta-item .icon {
        font-size: 13px;
        filter: saturate(0.7);
      }
      .meta-sep {
        color: var(--ink-4);
      }

      /* ============================================================
       LAYOUT
       ============================================================ */
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 140px 32px 80px;
      }

      /* ============================================================
       HERO
       ============================================================ */
      .hero {
        padding: 20px 0 40px;
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--rose-deep);
        margin-bottom: 28px;
      }

      .eyebrow::before,
      .eyebrow::after {
        content: "";
        width: 24px;
        height: 1px;
        background: var(--rose-deep);
      }

      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(38px, 5.4vw, 68px);
        line-height: 1.04;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin: 0 0 22px;
      }

      h1 em {
        font-style: italic;
        color: var(--rose-deep);
      }

      .hero-sub {
        font-size: 16px;
        line-height: 1.6;
        color: var(--ink-2);
        margin: 0 auto;
        max-width: 44ch;
        font-weight: 400;
      }

      /* ============================================================
       EVENTS LIST
       ============================================================ */
      .events-list {
        margin-top: 72px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .event-card {
        position: relative;
        padding: 40px 40px 32px;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: 4px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 20px 45px rgba(30, 26, 22, 0.08),
          0 4px 12px rgba(30, 26, 22, 0.04);
        animation: cardIn 0.7s var(--ease) backwards;
        transition:
          box-shadow 0.4s var(--ease),
          transform 0.4s var(--ease);
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .event-card:hover {
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 28px 60px rgba(30, 26, 22, 0.12),
          0 6px 16px rgba(30, 26, 22, 0.06);
      }

      /* Inner frame */
      .event-card::after {
        content: "";
        position: absolute;
        inset: 14px;
        border: 1px solid rgba(30, 26, 22, 0.05);
        border-radius: 2px;
        pointer-events: none;
      }

      /* Corner ticks */
      .event-card::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 8px;
        width: 12px;
        height: 12px;
        border-top: 1px solid var(--ink-3);
        border-left: 1px solid var(--ink-3);
        opacity: 0.4;
        pointer-events: none;
        z-index: 2;
      }

      /* Card header */
      .event-head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 24px;
        align-items: flex-start;
        padding-bottom: 22px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--line);
        position: relative;
        z-index: 1;
      }

      .event-emoji {
        font-size: 36px;
        line-height: 1;
        filter: saturate(0.75);
        flex-shrink: 0;
      }

      .event-info {
        min-width: 0;
      }

      .event-label {
        display: block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 6px;
      }

      .event-title {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(20px, 2.4vw, 26px);
        line-height: 1.15;
        letter-spacing: -0.015em;
        color: var(--ink);
        margin: 0 0 4px;
      }

      .event-date {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 14px;
        color: var(--rose-deep);
        letter-spacing: 0.01em;
        margin: 0;
      }

      /* Delete button */
      .event-delete {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-3);
        font-size: 12px;
        background: transparent;
        border: 1px solid transparent;
        transition: all 0.35s var(--ease);
        cursor: pointer;
        flex-shrink: 0;
        position: relative;
        z-index: 2;
      }

      .event-delete:hover {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
        transform: rotate(90deg);
      }

      /* Countdown grid */
      .countdown-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        position: relative;
        z-index: 1;
      }

      .time-block {
        text-align: center;
        padding: 4px 8px;
        position: relative;
      }

      .time-block + .time-block::before {
        content: "";
        position: absolute;
        left: 0;
        top: 22%;
        bottom: 22%;
        width: 1px;
        background: var(--line);
      }

      .time-num {
        display: block;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(36px, 5.5vw, 56px);
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
        transition: color 0.3s;
      }

      .time-num.tick {
        animation: tickPop 0.5s var(--ease-spring);
      }

      @keyframes tickPop {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.08);
          color: var(--rose-deep);
        }
        100% {
          transform: scale(1);
          color: var(--ink);
        }
      }

      .time-label {
        display: block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-top: 10px;
      }

      /* Today / passed state */
      .event-card.today {
        border-color: var(--rose);
      }

      .event-card.today::before {
        border-color: var(--rose-deep);
        opacity: 0.7;
      }

      .event-status {
        display: none;
        text-align: center;
        padding: 20px 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 20px;
        color: var(--rose-deep);
        position: relative;
        z-index: 1;
      }

      .event-card.today .event-status,
      .event-card.passed .event-status {
        display: block;
      }

      .event-card.today .countdown-grid,
      .event-card.passed .countdown-grid {
        display: none;
      }

      /* ============================================================
       ADD PANEL
       ============================================================ */
      .add-panel {
        margin-top: 72px;
        padding: 44px 40px 40px;
        background: var(--surface);
        border: 1px dashed var(--line-2);
        border-radius: 4px;
        position: relative;
        animation: cardIn 0.7s var(--ease) 0.3s backwards;
      }

      .add-panel-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 18px;
        margin-bottom: 30px;
        border-bottom: 1px solid var(--line);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .add-panel-head .latin {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 14px;
        letter-spacing: 0.02em;
        text-transform: none;
        color: var(--rose-deep);
      }

      .add-panel-title {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(22px, 2.8vw, 30px);
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin: 0 0 30px;
        text-align: left;
      }

      .add-panel-title em {
        font-style: italic;
        color: var(--rose-deep);
      }

      /* Field */
      .field {
        margin-bottom: 20px;
      }

      .field label {
        display: block;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 10px;
      }

      .field input[type="text"],
      .field input[type="date"],
      .field input[type="time"] {
        width: 100%;
        padding: 14px 16px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 12px;
        font-family: "Inter", sans-serif;
        font-size: 15px;
        color: var(--ink);
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
        -webkit-appearance: none;
        appearance: none;
      }

      .field input:focus {
        outline: none;
        border-color: var(--rose-deep);
        background: var(--surface);
        box-shadow: 0 0 0 4px rgba(143, 100, 114, 0.1);
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      /* Emoji picker */
      .emoji-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .emoji-choice {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s var(--ease);
        padding: 0;
        filter: saturate(0.75);
      }

      .emoji-choice:hover {
        transform: translateY(-2px);
        border-color: var(--rose);
        background: var(--surface);
      }

      .emoji-choice.selected {
        background: var(--ink);
        border-color: var(--ink);
        filter: saturate(1);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.12) inset,
          0 8px 18px rgba(30, 26, 22, 0.2);
      }

      /* Add button */
      .btn-add {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 18px 32px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-family: "Inter", sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        border: none;
        cursor: pointer;
        transition: all 0.35s var(--ease);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.12) inset,
          0 8px 20px rgba(30, 26, 22, 0.2);
        margin-top: 8px;
      }

      .btn-add:hover {
        background: #000;
        transform: translateY(-2px);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.12) inset,
          0 14px 32px rgba(30, 26, 22, 0.26);
      }

      .btn-add:active {
        transform: translateY(0) scale(0.99);
      }

      .btn-add .add-arrow {
        display: inline-block;
        transition: transform 0.4s var(--ease);
        font-size: 14px;
      }

      .btn-add:hover .add-arrow {
        transform: translateX(4px);
      }

      /* ============================================================
       EMPTY STATE
       ============================================================ */
      .empty-hint {
        text-align: center;
        padding: 72px 40px;
        background: var(--surface);
        border: 1px dashed var(--line-2);
        border-radius: 4px;
      }

      .empty-hint .big {
        display: block;
        font-size: 44px;
        line-height: 1;
        margin-bottom: 20px;
        filter: saturate(0.7);
      }

      .empty-hint .empty-title {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 22px;
        color: var(--ink);
        line-height: 1.35;
        margin: 0 0 8px;
      }

      .empty-hint .empty-sub {
        font-size: 13.5px;
        color: var(--ink-3);
        margin: 0;
        line-height: 1.5;
      }

      /* ============================================================
       NAV
       ============================================================ */
      .nav-wrap {
        margin-top: 80px;
        padding-top: 40px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 18px 32px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-family: "Inter", sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition: all 0.35s var(--ease);
        border: none;
        cursor: pointer;
      }

      .back-link:hover {
        background: #000;
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(30, 26, 22, 0.24);
      }

      .back-link .arrow {
        display: inline-block;
        transition: transform 0.4s var(--ease);
        font-size: 15px;
      }

      .back-link:hover .arrow {
        transform: translateX(-5px);
      }

      .nav-link-secondary {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 18px 28px;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-2);
        border: 1px solid var(--line-2);
        font-family: "Inter", sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
        transition: all 0.35s var(--ease);
        cursor: pointer;
      }

      .nav-link-secondary:hover {
        background: var(--surface-2);
        color: var(--ink);
        border-color: var(--ink-3);
        transform: translateY(-2px);
      }

      .nav-link-secondary .icon {
        font-size: 14px;
        filter: saturate(0.75);
        transition: transform 0.4s var(--ease-spring);
      }

      .nav-link-secondary:hover .icon {
        transform: rotate(-180deg);
      }

      /* ============================================================
       FOOTER
       ============================================================ */
      .footer {
        padding: 40px 32px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
        max-width: 1240px;
        margin: 40px auto 0;
      }

      /* ============================================================
       SPARKLES
       ============================================================ */
      .sparkle {
        position: fixed;
        pointer-events: none;
        z-index: 6000;
        filter: saturate(0.65);
      }

      /* ============================================================
       TOAST
       ============================================================ */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%) translateY(20px);
        padding: 14px 22px;
        background: var(--ink);
        color: var(--paper);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        box-shadow: 0 20px 40px rgba(30, 26, 22, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: all 0.5s var(--ease);
        z-index: 6000;
        max-width: calc(100vw - 40px);
        text-align: center;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ============================================================
       RESPONSIVE
       ============================================================ */
      @media (max-width: 640px) {
        main {
          padding: 120px 20px 60px;
        }
        h1 {
          font-size: clamp(30px, 8vw, 44px);
        }

        .events-list {
          margin-top: 56px;
          gap: 14px;
        }

        .event-card {
          padding: 28px 22px 24px;
        }

        .event-head {
          grid-template-columns: auto 1fr auto;
          gap: 16px;
          padding-bottom: 16px;
          margin-bottom: 18px;
        }
        .event-emoji {
          font-size: 30px;
        }
        .event-title {
          font-size: 19px;
        }
        .event-date {
          font-size: 13px;

    <!-- ============================================================
       TIME + WEATHER
       ============================================================ -->
    <script>
      function updateTimeWidget() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("timeText").textContent = `${hh}:${mm}`;

        const h = now.getHours();
        let icon = "🌙";
        if (h >= 5 && h < 12) icon = "🌅";
        else if (h >= 12 && h < 18) icon = "☀️";
        else if (h >= 18 && h < 23) icon = "🌆";
        document.getElementById("timeIcon").textContent = icon;
      }
      updateTimeWidget();
      setInterval(updateTimeWidget, 1000);

      const WEATHER_CITY = { name: "Улан-Удэ" };

      function pickIconFromDesc(desc) {
        desc = (desc || "").toLowerCase();
        if (desc.includes("sun") || desc.includes("clear")) return "☀️";
        if (desc.includes("partly") || desc.includes("mostly sun")) return "🌤️";
        if (desc.includes("cloud") || desc.includes("overcast")) return "☁️";
        if (desc.includes("rain") || desc.includes("drizzle")) return "🌧️";
        if (desc.includes("snow") || desc.includes("sleet")) return "❄️";
        if (desc.includes("thunder") || desc.includes("storm")) return "⛈️";
        if (desc.includes("fog") || desc.includes("mist")) return "🌫️";
        return "🌤️";
      }

      function seasonalWeather() {
        const m = new Date().getMonth();
        let icon, temp;
        if (m === 11 || m === 0 || m === 1) {
          icon = "❄️";
          temp = -18;
        } else if (m === 2 || m === 3) {
          icon = "🌨️";
          temp = -5;
        } else if (m === 4) {
          icon = "🌱";
          temp = 8;
        } else if (m >= 5 && m <= 7) {
          icon = "☀️";
          temp = 24;
        } else if (m === 8) {
          icon = "🍂";
          temp = 12;
        } else {
          icon = "🌧️";
          temp = 2;
        }
        return { icon, temp };
      }

      async function loadWeather() {
        const iconEl = document.getElementById("weatherIcon");
        const textEl = document.getElementById("weatherText");
        iconEl.textContent = "⛅";
        textEl.textContent = "...";

        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 5000);
          const res = await fetch(
            `https://wttr.in/${encodeURIComponent(WEATHER_CITY.name)}?format=j1`,
            { signal: ctrl.signal, cache: "no-store" },
          );
          clearTimeout(timer);

          if (res.ok) {
            const data = await res.json();
            const cur = data.current_condition && data.current_condition[0];
            if (cur && cur.temp_C !== undefined) {
              const temp = parseInt(cur.temp_C, 10);
              const desc =
                cur.weatherDesc && cur.weatherDesc[0]
                  ? cur.weatherDesc[0].value
                  : "";
              iconEl.textContent = pickIconFromDesc(desc);
              textEl.textContent = `${temp > 0 ? "+" : ""}${temp}°C`;
              return;
            }
          }
        } catch (e) {}

        const w = seasonalWeather();
        iconEl.textContent = w.icon;
        textEl.textContent = `${w.temp > 0 ? "+" : ""}${w.temp}°C`;
      }

      loadWeather();
      setInterval(loadWeather, 30 * 60 * 1000);
      document
        .getElementById("infoWidget")
        .addEventListener("click", loadWeather);
    </script>

    <!-- ============================================================
       COUNTDOWN SCRIPT
       ============================================================ -->
    <script>
      // ============================================================
      // ⚠️ СТАНДАРТНЫЕ ДАТЫ
      // Формат: "YYYY-MM-DD"
      // annual: true — праздник повторяется каждый год
      // ============================================================
      const DEFAULT_EVENTS = [
        {
          id: "birthday_veronika",
          name: "День рождения Вероники",
          emoji: "🎂",
          date: "2007-04-14",
          annual: true,
        },
        {
          id: "birthday_me",
          name: "День рождения Анатолия",
          emoji: "🎉",
          date: "2006-06-06",
          annual: true,
        },
        {
          id: "our_date",
          name: "Наша дата",
          emoji: "💖",
          date: "2025-10-04",
          annual: true,
        },
      ];
      // ============================================================

      const STORAGE_KEY = "countdown_events";

      let events = [];
      let selectedEmoji = "💖";

      // ---------- LOAD / SAVE ----------
      function loadEvents() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            events = JSON.parse(saved);
          } else {
            events = JSON.parse(JSON.stringify(DEFAULT_EVENTS));
            saveEvents();
          }
        } catch {
          events = JSON.parse(JSON.stringify(DEFAULT_EVENTS));
        }
      }

      function saveEvents() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        } catch {}
      }

      // ---------- NEXT DATE ----------
      function getNextDate(event) {
        const now = new Date();
        const [year, month, day] = event.date.split("-").map(Number);

        if (event.annual) {
          let target = new Date(now.getFullYear(), month - 1, day);
          if (event.time) {
            const [h, m] = event.time.split(":").map(Number);
            target.setHours(h, m, 0, 0);
          } else {
            target.setHours(0, 0, 0, 0);
          }
          if (target <= now) {
            target = new Date(now.getFullYear() + 1, month - 1, day);
            if (event.time) {
              const [h, m] = event.time.split(":").map(Number);
              target.setHours(h, m, 0, 0);
            } else {
              target.setHours(0, 0, 0, 0);
            }
          }
          return target;
        } else {
          const target = new Date(year, month - 1, day);
          if (event.time) {
            const [h, m] = event.time.split(":").map(Number);
            target.setHours(h, m, 0, 0);
          } else {
            target.setHours(0, 0, 0, 0);
          }
          return target;
        }
      }

      // ---------- FORMAT DATE ----------
      function formatDate(event) {
        const [year, month, day] = event.date.split("-").map(Number);
        const months = [
          "января",
          "февраля",
          "марта",
          "апреля",
          "мая",
          "июня",
          "июля",
          "августа",
          "сентября",
          "октября",
          "ноября",
          "декабря",
        ];

        let str = `${day} ${months[month - 1]}`;

        if (!event.annual) {
          str += ` ${year}`;
        }

        if (event.time && event.time !== "00:00") {
          str += `, ${event.time}`;
        }

        return str;
      }

      // ---------- RENDER ----------
      function renderEvents() {
        const list = document.getElementById("eventsList");

        if (events.length === 0) {
          list.innerHTML = `
          <div class="empty-hint">
            <span class="big">🎈</span>
            <p class="empty-title">Добавь первую важную дату —<br>и я начну отсчёт до неё</p>
            <p class="empty-sub">Всё сохранится прямо здесь, в браузере</p>
          </div>
        `;
          return;
        }

        // Sort by next date
        const sortedEvents = [...events].sort((a, b) => {
          return getNextDate(a) - getNextDate(b);
        });

        list.innerHTML = sortedEvents
          .map((event, index) => {
            const next = getNextDate(event);
            const now = new Date();

            const isToday =
              next.getDate() === now.getDate() &&
              next.getMonth() === now.getMonth() &&
              next.getFullYear() === now.getFullYear();

            const isPassed = !event.annual && next < now;
            const cardClass = isToday ? "today" : isPassed ? "passed" : "";

            return `
          <div class="event-card ${cardClass}" data-id="${event.id}" style="animation-delay: ${index * 0.08}s">
            <button class="event-delete" onclick="deleteEvent('${event.id}')" title="Удалить" aria-label="Удалить">✕</button>

            <div class="event-head">
              <span class="event-emoji">${event.emoji}</span>
              <div class="event-info">
                <span class="event-label">Событие</span>
                <h3 class="event-title">${event.name}</h3>
                <p class="event-date">${formatDate(event)}</p>
              </div>
              <span></span>
            </div>

            <div class="event-status">
              ${isToday ? "Сегодня — с праздником, любимая" : "Уже прошло — но помню"}
            </div>

            <div class="countdown-grid">
              <div class="time-block">
                <span class="time-num" data-unit="days">0</span>
                <span class="time-label">дней</span>
              </div>
              <div class="time-block">
                <span class="time-num" data-unit="hours">0</span>
                <span class="time-label">часов</span>
              </div>
              <div class="time-block">
                <span class="time-num" data-unit="minutes">0</span>
                <span class="time-label">минут</span>
              </div>
              <div class="time-block">
                <span class="time-num" data-unit="seconds">0</span>
                <span class="time-label">секунд</span>
              </div>
            </div>
          </div>
        `;
          })
          .join("");

        updateAllCountdowns();
      }

      // ---------- UPDATE ----------
      function updateAllCountdowns() {
        const now = new Date();
        const cards = document.querySelectorAll(".event-card");

        cards.forEach((card) => {
          const id = card.dataset.id;
          const event = events.find((e) => e.id === id);
          if (!event) return;

          const next = getNextDate(event);
          const diffMs = next - now;

          if (diffMs <= 0) {
            card.classList.add("today");
            return;
          }

          const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diffMs / (1000 * 60)) % 60);
          const seconds = Math.floor((diffMs / 1000) % 60);

          const values = { days, hours, minutes, seconds };

          card.querySelectorAll(".time-num").forEach((el) => {
            const unit = el.dataset.unit;
            const oldValue = parseInt(el.textContent, 10);
            const newValue = values[unit];

            if (oldValue !== newValue) {
              el.textContent = newValue;
              el.classList.remove("tick");
              void el.offsetWidth;
              el.classList.add("tick");
            }
          });
        });
      }

      setInterval(updateAllCountdowns, 1000);

      // ---------- ADD ----------
      function addEvent() {
        const name = document.getElementById("eventName").value.trim();
        const date = document.getElementById("eventDate").value;
        const time = document.getElementById("eventTime").value || "00:00";

        if (!name) {
          showToast("Напиши название события");
          document.getElementById("eventName").focus();
          return;
        }
        if (!date) {
          showToast("Выбери дату");
          document.getElementById("eventDate").focus();
          return;
        }

        const isAnnual = true;

        const newEvent = {
          id: "event_" + Date.now(),
          name,
          emoji: selectedEmoji,
          date,
          time,
          annual: isAnnual,
        };

        events.push(newEvent);
        saveEvents();
        renderEvents();

        for (let i = 0; i < 20; i++) {
          setTimeout(
            () =>
              spawnSparkle(
                Math.random() * window.innerWidth,
                window.innerHeight * 0.3 +
                  Math.random() * window.innerHeight * 0.4,
              ),
            i * 40,
          );
        }

        showToast(`Добавлено: ${name}`);

        document.getElementById("eventName").value = "";
        document.getElementById("eventDate").value = "";
        document.getElementById("eventTime").value = "00:00";
      }

      // ---------- DELETE ----------
      function deleteEvent(id) {
        const event = events.find((e) => e.id === id);
        if (!event) return;
        if (!confirm(`Удалить «${event.name}»?`)) return;

        events = events.filter((e) => e.id !== id);
        saveEvents();
        renderEvents();
        showToast("Дата удалена");
      }

      // ---------- RESET ----------
      function resetEvents() {
        if (
          !confirm(
            "Вернуть стандартные даты? Твои добавленные события удалятся.",
          )
        )
          return;
        events = JSON.parse(JSON.stringify(DEFAULT_EVENTS));
        saveEvents();
        renderEvents();
        showToast("Стандартные даты восстановлены");
      }

      // ---------- EMOJI PICKER ----------
      document.querySelectorAll(".emoji-choice").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".emoji-choice")
            .forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          selectedEmoji = btn.dataset.emoji;
        });
      });

      // ---------- SPARKLES ----------
      function spawnSparkle(x, y) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.textContent = ["✦", "✧", "·", "·", "✺"][
          Math.floor(Math.random() * 5)
        ];
        sparkle.style.left = x + "px";
        sparkle.style.top = y + "px";
        sparkle.style.color = Math.random() > 0.5 ? "#8f6472" : "#b58794";
        sparkle.style.fontSize = 10 + Math.random() * 10 + "px";
        sparkle.style.transition = `all ${0.8 + Math.random() * 0.6}s cubic-bezier(0.16, 1, 0.3, 1)`;
        document.body.appendChild(sparkle);

        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 140;
        requestAnimationFrame(() => {
          sparkle.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0.4)`;
          sparkle.style.opacity = "0";
        });
        setTimeout(() => sparkle.remove(), 1600);
      }

      // ---------- TOAST ----------
      let toastTimer = null;
      function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
      }

      // ---------- START ----------
      loadEvents();
      renderEvents();

      document.getElementById("eventDate").min = new Date()
        .toISOString()
        .split("T")[0];
    </script>
