<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Терновый Трон · Котик 💗</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/tokens.css" />
    <link rel="stylesheet" href="game-thorn.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-top">
        <div class="bar-wrap">
          <div class="bar hp">
            <div id="hpFill"></div>
            <span id="hpText">100 / 100</span>
          </div>
          <div id="shieldRow">🔰 0</div>
        </div>
        <div class="wave-pill">
          <span class="wp-label">ВОЛНА</span>
          <span id="waveNum">1</span>
          <span class="boss-hint" id="bossHint">до босса 9</span>
        </div>
        <div class="wave-pill level-pill">
          <span class="wp-label">УР.</span>
          <span id="levelNum">1</span>
        </div>
        <div class="score-pill">
          <span class="sp-label">ОЧКИ</span>
          <span id="scoreVal">0</span>
        </div>
        <div class="kills" id="killCount">💀 0</div>
      </div>
      <div id="centerMsg"></div>
    </div>

    <div id="bossBar">
      <div class="boss-name" id="bossName">BOSS</div>
      <div class="bar"><div id="bossFill"></div></div>
    </div>

    <div id="overlay"></div>

    <script src="game-thorn.js"></script>
  </body>
</html>
