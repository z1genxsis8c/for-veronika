<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Терновый Трон · Котик 💗</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Единый движок: подключаем только tokens.css для консистентности.
         base.css и widgets.js здесь НЕ подключаем — это полноэкранный
         canvas-гейм с собственной тёмной палитрой и своим HUD. -->
    <link rel="stylesheet" href="shared/tokens.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #0b0614;
      }
      body {
        font-family:
          "Nunito",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #fff;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game {
        display: block;
        position: absolute;
        inset: 0;
      }

      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.4s;
      }
      #hud.show {
        opacity: 1;
      }
      .hud-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        flex-wrap: wrap;
      }
      .bar-wrap {
        flex: 1;
        min-width: 120px;
        max-width: 300px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .bar-wrap.right {
        align-items: flex-end;
      }
      .bar {
        position: relative;
        width: 100%;
        height: 20px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 180, 225, 0.25);
        overflow: hidden;
        backdrop-filter: blur(6px);
      }
      .bar span {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.5px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        z-index: 2;
      }
      #hpFill {
        height: 100%;
        width: 100%;
        border-radius: 12px;
        background: linear-gradient(90deg, #ff4d8d, #ff8ec4);
        transition: width 0.18s ease;
        box-shadow: 0 0 18px rgba(255, 77, 141, 0.55) inset;
      }
      .bar.xp {
        height: 12px;
        max-width: 220px;
      }
      #xpFill {
        height: 100%;
        width: 0%;
        border-radius: 12px;
        background: linear-gradient(90deg, #a855f7, #f0abfc);
        transition: width 0.18s ease;
        box-shadow: 0 0 14px rgba(200, 120, 255, 0.6) inset;
      }
      .bar.xp span {
        font-size: 10px;
      }
      .wave-pill {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        padding: 6px 16px;
        border-radius: 14px;
        background: rgba(255, 110, 180, 0.13);
        border: 1px solid rgba(255, 150, 210, 0.35);
        backdrop-filter: blur(6px);
        box-shadow: 0 0 24px rgba(255, 80, 160, 0.18);
      }
      .wp-label {
        font-size: 8px;
        letter-spacing: 3px;
        color: #ffa8d4;
        font-weight: 700;
      }
      #waveNum {
        font-size: 20px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 0 14px rgba(255, 120, 190, 0.9);
      }
      .score-pill {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        padding: 6px 14px;
        border-radius: 14px;
        background: rgba(255, 215, 0, 0.13);
        border: 1px solid rgba(255, 215, 0, 0.35);
        backdrop-filter: blur(6px);
      }
      .sp-label {
        font-size: 8px;
        letter-spacing: 2px;
        color: #ffd166;
        font-weight: 700;
      }
      #scoreVal {
        font-size: 16px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
      }
      .kills {
        font-size: 11px;
        font-weight: 700;
        color: #e9c9ff;
        opacity: 0.8;
      }

      #bossBar {
        position: absolute;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, 86%);
        z-index: 11;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #bossBar.show {
        opacity: 1;
      }
      #bossBar .boss-name {
        text-align: center;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffd166;
        text-shadow: 0 0 10px rgba(255, 180, 80, 0.9);
        margin-bottom: 4px;
      }
      #bossBar .bar {
        height: 14px;
        background: rgba(0, 0, 0, 0.55);
        border-color: rgba(255, 80, 80, 0.5);
      }
      #bossFill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ff2d55, #ff7a9c);
        transition: width 0.15s;
      }

      #centerMsg {
        position: absolute;
        left: 50%;
        top: 34%;
        transform: translate(-50%, -50%);
        font-size: clamp(24px, 6vw, 50px);
        font-weight: 900;
        text-align: center;
        color: #fff;
        text-shadow:
          0 0 26px rgba(255, 90, 170, 0.95),
          0 0 60px rgba(180, 80, 255, 0.6);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        letter-spacing: 1px;
        padding: 0 12px;
      }
      #centerMsg.show {
        opacity: 1;
      }

      #overlay {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: radial-gradient(
          circle at 50% 40%,
          rgba(70, 20, 80, 0.72),
          rgba(8, 3, 16, 0.92)
        );
        backdrop-filter: blur(9px);
        overflow-y: auto;
      }
      #overlay.show {
        display: flex;
      }

      .panel {
        width: 100%;
        max-width: 860px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.5, 1);
        padding: 12px 0;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .panel h1 {
        font-size: clamp(28px, 6.5vw, 54px);
        font-weight: 900;
        line-height: 1.05;
        background: linear-gradient(180deg, #fff, #ffb6dd 55%, #c98bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 22px rgba(255, 110, 190, 0.55));
      }
      .panel h2 {
        font-size: clamp(20px, 5vw, 32px);
        font-weight: 900;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 110, 190, 0.7);
      }
      .sub {
        font-size: 14px;
        color: #e4c8f5;
        opacity: 0.9;
        max-width: 620px;
        line-height: 1.55;
      }
      .tiny {
        font-size: 12px;
        color: #c9a9e0;
        opacity: 0.75;
        line-height: 1.6;
      }

      .btn {
        pointer-events: auto;
        cursor: pointer;
        border: none;
        padding: 14px 40px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.5px;
        color: #3d0722;
        background: linear-gradient(180deg, #ffe3f1, #ff9dcb);
        box-shadow:
          0 8px 0 #c4497f,
          0 0 34px rgba(255, 110, 180, 0.55);
        transition:
          transform 0.09s,
          box-shadow 0.09s;
        text-decoration: none;
        display: inline-block;
      }
      .btn:active {
        transform: translateY(5px);
        box-shadow:
          0 3px 0 #c4497f,
          0 0 26px rgba(255, 110, 180, 0.5);
      }
      .btn.ghost {
        background: transparent;
        color: #ffc7e5;
        box-shadow: none;
        border: 2px solid rgba(255, 150, 210, 0.45);
        padding: 10px 26px;
        font-size: 14px;
      }
      .btn.gold {
        background: linear-gradient(180deg, #fff0b3, #ffd166);
        box-shadow:
          0 8px 0 #b8860b,
          0 0 34px rgba(255, 200, 80, 0.55);
        color: #5a3a00;
      }
      .btn.gold:active {
        box-shadow:
          0 3px 0 #b8860b,
          0 0 26px rgba(255, 200, 80, 0.5);
      }

      .cards {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
      }
      .card {
        pointer-events: auto;
        cursor: pointer;
        font-family: inherit;
        color: #fff;
        flex: 1 1 200px;
        max-width: 240px;
        min-width: 160px;
        padding: 18px 12px 14px;
        border-radius: 20px;
        text-align: center;
        background: linear-gradient(
          165deg,
          rgba(255, 140, 200, 0.16),
          rgba(120, 60, 200, 0.18)
        );
        border: 1.5px solid rgba(255, 160, 215, 0.32);
        backdrop-filter: blur(8px);
        transition:
          transform 0.14s,
          border-color 0.14s,
          box-shadow 0.14s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
      }
      .card:hover {
        transform: translateY(-6px);
        border-color: rgba(255, 190, 230, 0.85);
        box-shadow: 0 12px 38px rgba(255, 90, 170, 0.4);
      }
      .card:active {
        transform: translateY(-2px) scale(0.98);
      }
      .card .ic {
        font-size: 34px;
        line-height: 1;
        filter: drop-shadow(0 0 12px rgba(255, 140, 200, 0.8));
      }
      .card .cn {
        font-size: 15px;
        font-weight: 900;
        color: #fff;
      }
      .card .cd {
        font-size: 12px;
        color: #e8cdf7;
        opacity: 0.92;
        line-height: 1.4;
      }
      .card .cl {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.4px;
        color: #ffa3d3;
        background: rgba(255, 120, 190, 0.14);
        padding: 3px 10px;
        border-radius: 999px;
      }

      .stats {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .stat-box {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .stat-box b {
        font-size: 26px;
        font-weight: 900;
        color: #ffb3dd;
        text-shadow: 0 0 16px rgba(255, 110, 190, 0.7);
      }
      .stat-box i {
        font-style: normal;
        font-size: 10px;
        letter-spacing: 2px;
        color: #c9a9e0;
        opacity: 0.8;
      }

      .love {
        font-size: clamp(15px, 3.2vw, 21px);
        font-weight: 700;
        line-height: 1.6;
        color: #ffe1f2;
        max-width: 620px;
        text-shadow: 0 0 24px rgba(255, 110, 190, 0.55);
      }
      .hearts-big {
        font-size: 32px;
        letter-spacing: 8px;
        animation: beat 1.2s ease-in-out infinite;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.14);
        }
      }

      .coin-box {
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: center;
        padding: 14px 22px;
        border-radius: 20px;
        background: linear-gradient(
          165deg,
          rgba(255, 215, 0, 0.14),
          rgba(255, 150, 0, 0.12)
        );
        border: 1.5px solid rgba(255, 215, 0, 0.4);
        box-shadow: 0 0 32px rgba(255, 200, 80, 0.25);
      }
      .coin-box .big {
        font-size: 38px;
        filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.7));
      }
      .coin-box .amt {
        font-size: 32px;
        font-weight: 900;
        color: #ffd166;
        text-shadow: 0 0 14px rgba(255, 215, 0, 0.7);
      }
      .coin-box .lbl {
        font-size: 11px;
        letter-spacing: 2px;
        color: #ffd166;
        opacity: 0.85;
      }

      @media (max-width: 620px) {
        .hud-top {
          padding: 8px 10px;
          gap: 6px;
        }
        .bar-wrap {
          max-width: 120px;
          min-width: 80px;
        }
        .kills {
          display: none;
        }
        .wave-pill {
          padding: 5px 10px;
        }
        #waveNum {
          font-size: 16px;
        }
        .score-pill {
          padding: 5px 10px;
        }
        #scoreVal {
          font-size: 14px;
        }
        .card {
          flex: 1 1 100%;
          max-width: 340px;
        }
        .btn {
          padding: 12px 28px;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-top">
        <div class="bar-wrap">
          <div class="bar hp">
            <div id="hpFill"></div>
            <span id="hpText">100 / 100</span>
          </div>
        </div>
        <div class="wave-pill">
          <span class="wp-label">ВОЛНА</span>
          <span id="waveNum">1</span>
        </div>
        <div class="score-pill">
          <span class="sp-label">ОЧКИ</span>
          <span id="scoreVal">0</span>
        </div>
        <div class="bar-wrap right">
          <div class="bar xp">
            <div id="xpFill"></div>
            <span id="xpText">Ур. 1</span>
          </div>
          <div class="kills" id="killCount">💀 0</div>
        </div>
      </div>
      <div id="centerMsg"></div>
    </div>

    <div id="bossBar">
      <div class="boss-name" id="bossName">BOSS</div>
      <div class="bar"><div id="bossFill"></div></div>
    </div>

    <div id="overlay"></div>

    <script>
      /* =========================================================
   НАСТРОЙКИ — можно менять под себя 💗
   ========================================================= */
      const CONFIG = {
        playerName: "Котик",
        girlName: "Любимая",
        finalMessage:
          "Ты — моё самое тёплое место на свете.<br>Спасибо, что ты рядом. 💗",
        maxWave: 100,
        coinDivisor: 2000,
        unlockWaveAch: 5,
        unlockScoreAch: 50000,
      };

      /* =========================================================
   УТИЛИТЫ
   ========================================================= */
      const TAU = Math.PI * 2;
      const rnd = (a, b) => a + Math.random() * (b - a);
      const rndi = (a, b) => Math.floor(rnd(a, b + 1));
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const dist2 = (x1, y1, x2, y2) => {
        const dx = x1 - x2,
          dy = y1 - y2;
        return dx * dx + dy * dy;
      };
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = rndi(0, i);
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      /* =========================================================
   ЗВУК
   ========================================================= */
      let actx = null;
      function beep(freq, dur, type = "sine", vol = 0.05, slideTo = 0) {
        try {
          if (!actx)
            actx = new (window.AudioContext || window.webkitAudioContext)();
          if (actx.state === "suspended") actx.resume();
          const t = actx.currentTime;
          const o = actx.createOscillator(),
            g = actx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, t);
          if (slideTo)
            o.frequency.exponentialRampToValueAtTime(
              Math.max(50, slideTo),
              t + dur,
            );
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g);
          g.connect(actx.destination);
          o.start(t);
          o.stop(t + dur + 0.02);
        } catch (e) {}
      }

      /* =========================================================
   КАНВАС
   ========================================================= */
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      let W = 0,
        H = 0,
        DPR = 1,
        bgGrad = null,
        vignette = null;

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        bgGrad = ctx.createRadialGradient(
          W * 0.5,
          H * 0.42,
          0,
          W * 0.5,
          H * 0.5,
          Math.max(W, H) * 0.78,
        );
        bgGrad.addColorStop(0, "#241035");
        bgGrad.addColorStop(0.45, "#170a26");
        bgGrad.addColorStop(1, "#0a0412");

        vignette = ctx.createRadialGradient(
          W * 0.5,
          H * 0.5,
          Math.min(W, H) * 0.28,
          W * 0.5,
          H * 0.5,
          Math.max(W, H) * 0.78,
        );
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(4,0,10,.78)");

        if (G.player) {
          G.player.x = clamp(G.player.x, 30, W - 30);
          G.player.y = clamp(G.player.y, 30, H - 30);
        }
      }
      window.addEventListener("resize", resize);

      /* =========================================================
   СОСТОЯНИЕ ИГРЫ
   ========================================================= */
      const G = {
        state: "menu",
        t: 0,
        wave: 0,
        waveActive: false,
        spawnQueue: [],
        spawnTimer: 0,
        breather: 1.2,
        enemies: [],
        bullets: [],
        ebullets: [],
        orbs: [],
        parts: [],
        texts: [],
        player: null,
        upgradesTaken: {},
        kills: 0,
        pendingLevels: 0,
        shake: 0,
        msgTimer: 0,
        score: 0,
        bestScore: 0,
        boss: null,
      };

      try {
        G.bestScore =
          parseInt(localStorage.getItem("thornBestScore") || "0", 10) || 0;
      } catch (e) {}

      /* =========================================================
   ИГРОК
   ========================================================= */
      function makePlayer() {
        return {
          x: W / 2,
          y: H / 2,
          r: 17,
          hp: 100,
          maxHp: 100,
          speed: 228,
          dmg: 11,
          fireRate: 2.4,
          cool: 0,
          bulletSpeed: 570,
          projSize: 9,
          pierce: 0,
          multishot: 1,
          homing: 0,
          crit: 0.05,
          critMult: 2,
          lifesteal: 0,
          magnet: 115,
          regen: 0,
          thorns: 0,
          auraR: 0,
          auraTick: 0,
          xp: 0,
          xpNext: 5,
          level: 1,
          iframe: 0,
          hurtFlash: 0,
          t: 0,
          moving: 0,
          blink: 1,
          auraPulse: 0,
          armor: 0,
          dodge: 0,
          explosive: 0,
          freezeChance: 0,
          ricochet: 0,
          xpMult: 1,
        };
      }

      /* =========================================================
   АПГРЕЙДЫ
   ========================================================= */
      const UPGRADES = [
        {
          id: "dmg",
          name: "Острые коготки",
          icon: "🐾",
          desc: "+25% урона",
          max: 99,
          apply: (p) => {
            p.dmg *= 1.25;
          },
        },
        {
          id: "rate",
          name: "Быстрые лапки",
          icon: "⚡",
          desc: "+18% скорости стрельбы",
          max: 8,
          apply: (p) => {
            p.fireRate *= 1.18;
          },
        },
        {
          id: "speed",
          name: "Лёгкий шаг",
          icon: "👟",
          desc: "+12% скорости передвижения",
          max: 6,
          apply: (p) => {
            p.speed *= 1.12;
          },
        },
        {
          id: "hp",
          name: "Мягкая шубка",
          icon: "💗",
          desc: "+25 макс. HP и лечение",
          max: 12,
          apply: (p) => {
            p.maxHp += 25;
            p.hp += 25;
          },
        },
        {
          id: "multi",
          name: "Двойной пуф",
          icon: "✨",
          desc: "+1 снаряд",
          max: 5,
          apply: (p) => {
            p.multishot += 1;
          },
        },
        {
          id: "pierce",
          name: "Пробивающий взгляд",
          icon: "🎯",
          desc: "Снаряды пробивают +1 врага",
          max: 4,
          apply: (p) => {
            p.pierce += 1;
          },
        },
        {
          id: "homing",
          name: "Мурчащий прицел",
          icon: "🧭",
          desc: "Снаряды следуют за врагами",
          max: 4,
          apply: (p) => {
            p.homing += 1.6;
          },

      function availableTypes(n) {
        const a = ["thorn"];
        if (n >= 2) a.push("swift");
        if (n >= 4) a.push("brute");
        if (n >= 6) a.push("shooter");
        if (n >= 8) a.push("bomber");
        if (n >= 12) a.push("splitter");
        if (n >= 16) a.push("shield");
        if (n >= 20) a.push("charger");
        if (n >= 24) a.push("ghost");
        if (n >= 28) a.push("armored");
        if (n >= 32) a.push("healer");
        if (n >= 38) a.push("vampire");
        if (n >= 44) a.push("teleporter");
        if (n >= 50) a.push("sniper");
        if (n >= 56) a.push("summoner");
        return a;
      }

      function bossForWave(n) {
        const bosses = [
          "boss_king",
          "boss_queen",
          "boss_shadow",
          "boss_nightmare",
          "boss_heart",
          "boss_queen",
          "boss_shadow",
          "boss_nightmare",
          "boss_heart",
          "boss_king",
        ];
        const idx = Math.min(
          Math.max(0, Math.floor(n / 10) - 1),
          bosses.length - 1,
        );
        return bosses[idx];
      }

      function buildWave(n) {
        const isBoss = n % 10 === 0;
        let count;
        if (isBoss) count = Math.min(6 + Math.floor(n * 0.25), 20);
        else count = Math.min(5 + Math.floor(n * 0.65), 38);

        const types = availableTypes(n);
        const list = [];
        for (let i = 0; i < count; i++) list.push(pick(types));
        shuffle(list);
        if (isBoss) list.push(bossForWave(n));
        return list;
      }

      function spawnEnemy(type) {
        const base = ENEMY_TYPES[type];
        if (!base) return;
        const w = G.wave;

        const hpScale = 1 + (w - 1) * 0.35 + Math.pow(w / 10, 2.0);
        const dmgScale = 1 + (w - 1) * 0.1;
        const spScale = 1 + Math.min(w - 1, 40) * 0.012;

        const pad = base.boss ? 90 : 42;
        const side = rndi(0, 3);
        let x, y;
        if (side === 0) {
          x = rnd(pad, W - pad);
          y = pad;
        } else if (side === 1) {
          x = W - pad;
          y = rnd(pad, H - pad);
        } else if (side === 2) {
          x = rnd(pad, W - pad);
          y = H - pad;
        } else {
          x = pad;
          y = rnd(pad, H - pad);
        }

        const hp = base.hp * hpScale;

        const e = {
          type,
          x,
          y,
          r: base.r,
          color: base.color,
          spikes: base.spikes,
          hp,
          maxHp: hp,
          shield: base.shield ? base.shield * hpScale * 0.5 : 0,
          maxShield: base.shield ? base.shield * hpScale * 0.5 : 0,
          speed: base.speed * spScale,
          dmg: base.dmg * dmgScale,
          xp: base.xp,
          score: base.score,
          ranged: !!base.ranged,
          longRange: !!base.longRange,
          boss: !!base.boss,
          bossName: base.name || "",
          explodes: !!base.explodes,
          splitInto: base.splitInto || null,
          heals: !!base.heals,
          healsTick: 0,
          charges: !!base.charges,
          chargeCd: rnd(1.5, 3),
          chargeT: 0,
          ghost: !!base.ghost,
          teleports: !!base.teleports,
          teleCd: rnd(2, 4),
          armor: base.armor || 0,
          lifesteal: !!base.lifesteal,
          summons: base.summons || null,
          summonCd: rnd(3, 5),
          shootCd: rnd(1.2, 2.4),
          hitCd: 0,
          t: rnd(0, 10),
          flash: 0,
          slowT: 0,
        };
        G.enemies.push(e);

        if (base.boss) {
          G.boss = e;
          G.shake = Math.max(G.shake, 16);
          beep(70, 0.8, "sawtooth", 0.09, 40);
          showCenterMsg("⚠ " + base.name.toUpperCase() + " ⚠", 2.2);
          updateBossBar();
        }
      }

      function addParticles(x, y, n, color, opts = {}) {
        if (G.parts.length > 400) n = Math.min(n, 3);
        for (let i = 0; i < n; i++) {
          const a = rnd(0, TAU),
            s = rnd(opts.min || 40, opts.max || 190);
          G.parts.push({
            x,
            y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            r: rnd(2, 5),
            life: rnd(0.3, 0.7),
            max: 0.7,
            color,
            heart: opts.heart || false,
            rot: rnd(0, TAU),
          });
        }

      function saveRewardsToKitty(score) {
        const coins = Math.floor(score / CONFIG.coinDivisor);
        if (coins <= 0) return 0;
        try {
          const raw = localStorage.getItem("catState");
          const state = raw ? JSON.parse(raw) : {};
          state.coins = (state.coins || 0) + coins;
          state.achievements = Array.isArray(state.achievements)
            ? state.achievements
            : [];
          if (
            G.wave >= CONFIG.unlockWaveAch &&
            !state.achievements.includes("thorn_king")
          ) {
            state.achievements.push("thorn_king");
          }
          if (
            score >= CONFIG.unlockScoreAch &&
            !state.achievements.includes("thorn_legend")
          ) {
            state.achievements.push("thorn_legend");
          }
          localStorage.setItem("catState", JSON.stringify(state));
        } catch (e) {
          console.error("saveRewards error", e);
          return 0;
        }
        return coins;
      }

      function saveBestScore(score) {
        if (score > G.bestScore) {
          G.bestScore = score;
          try {
            localStorage.setItem("thornBestScore", String(score));
          } catch (e) {}
          return true;
        }
        return false;
      }

      function pickUpgrades(n) {
        const avail = UPGRADES.filter(
          (u) => (G.upgradesTaken[u.id] || 0) < u.max,
        );
        const pool = avail.slice();
        const out = [];
        while (out.length < n && pool.length)
          out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
        while (out.length < n) {
          out.push({
            id: "heal_" + out.length,
            name: "Подушечка любви",
            icon: "🩹",
            desc: "Восстановить 45 HP",
            max: 999,
            apply: (p) => {
              p.hp = Math.min(p.maxHp, p.hp + 45);
            },
          });
        }
        return out;
      }

    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">

  `;
        showOverlay(p);
        p.querySelector("#againBtn").onclick = () => startGame();

        if (isWin) {
          [0, 150, 300, 480].forEach((d, i) =>
            setTimeout(() => beep(660 + i * 220, 0.25, "sine", 0.06), d),
          );
        } else {
          beep(300, 0.5, "sawtooth", 0.08, 90);
        }
      }

      const keys = {};
      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        keys[k] = true;
        if (G.state === "upgrade" && ["1", "2", "3"].includes(k)) {
          const u = currentChoices[parseInt(k) - 1];
          if (u) takeUpgrade(u);
        }
        if (k === " " && G.state === "menu") {
          e.preventDefault();
          startGame();
        }
        if (
          ["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)
        )
          e.preventDefault();
      });
      window.addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      let touchId = null,
        tOrigin = { x: 0, y: 0 },
        tVec = { x: 0, y: 0 };
      canvas.addEventListener(
        "touchstart",
        (e) => {
          if (G.state !== "playing") return;
          const t = e.changedTouches[0];
          touchId = t.identifier;
          tOrigin = { x: t.clientX, y: t.clientY };
          tVec = { x: 0, y: 0 };
          e.preventDefault();
        },
        { passive: false },
      );
      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (touchId === null) return;
          for (const t of e.changedTouches) {
            if (t.identifier !== touchId) continue;
            const dx = t.clientX - tOrigin.x,
              dy = t.clientY - tOrigin.y;
            const len = Math.hypot(dx, dy);
            if (len > 14) {
              const m = Math.min(len, 70) / 70;
              tVec = { x: (dx / len) * m, y: (dy / len) * m };
            } else tVec = { x: 0, y: 0 };
          }
          e.preventDefault();
        },
        { passive: false },
      );
      canvas.addEventListener(
        "touchend",
        (e) => {
          for (const t of e.changedTouches)
            if (t.identifier === touchId) {
              touchId = null;
              tVec = { x: 0, y: 0 };
            }
        },
        { passive: false },
      );

      function update(dt) {
        G.t += dt;
        const p = G.player;
        p.t += dt;

        if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 40);
        if (G.msgTimer > 0) {
          G.msgTimer -= dt;
          if (G.msgTimer <= 0)
            document.getElementById("centerMsg").classList.remove("show");
        }

        let mx = 0,
          my = 0;
        if (keys["w"] || keys["arrowup"] || keys["ц"]) my--;
        if (keys["s"] || keys["arrowdown"] || keys["ы"]) my++;
        if (keys["a"] || keys["arrowleft"] || keys["ф"]) mx--;
        if (keys["d"] || keys["arrowright"] || keys["в"]) mx++;
        if (mx || my) {
          const l = Math.hypot(mx, my);
          mx /= l;
          my /= l;
        }
        if (tVec.x || tVec.y) {
          mx = tVec.x;
          my = tVec.y;
        }

        p.moving = mx || my ? 1 : 0;
        p.x = clamp(p.x + mx * p.speed * dt, p.r, W - p.r);
        p.y = clamp(p.y + my * p.speed * dt, p.r, H - p.r);
        if (mx !== 0) p.blink = mx > 0 ? 1 : -1;

        if (p.iframe > 0) p.iframe -= dt;
        if (p.hurtFlash > 0) p.hurtFlash -= dt;
        if (p.regen > 0) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);

        if (p.auraR > 0) {
          p.auraPulse += dt * 2.4;
          p.auraTick -= dt;
          if (p.auraTick <= 0) {
            p.auraTick = 0.5;
            const R2 = p.auraR * p.auraR;
            for (const e of G.enemies) {
              if (dist2(e.x, e.y, p.x, p.y) < R2 + e.r * e.r)
                damageEnemy(e, p.thorns, false);
            }
          }
        }

        p.cool -= dt;
        if (p.cool <= 0) {
          const tgt = nearestEnemy(p.x, p.y, 1100);
          if (tgt) {
            shoot(p, tgt);
            p.cool = 1 / p.fireRate;
          }
        }

        if (G.breather > 0) {
          G.breather -= dt;
          if (G.breather <= 0 && !G.waveActive) startWave(G.wave + 1);
        } else if (G.waveActive) {
          if (G.spawnQueue.length) {
            G.spawnTimer -= dt;
            if (G.spawnTimer <= 0) {
              spawnEnemy(G.spawnQueue.shift());
              G.spawnTimer = Math.max(0.16, 0.6 - G.wave * 0.004);
            }
          } else if (G.enemies.length === 0) {
            G.waveActive = false;
            if (G.wave >= CONFIG.maxWave) {
              endScreen(true);
              return;
            }
            G.breather = 2.2;
            p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.12);
            if (G.wave % 5 === 0) {
              p.maxHp += 5;
              p.hp = Math.min(p.maxHp, p.hp + 5);
            }
            showCenterMsg(`Волна ${G.wave} пройдена! 💗`, 1.5);
            beep(520, 0.18, "sine", 0.06, 780);
          }
        }

        updateEnemies(dt);
        updateBullets(dt);
        updateEBullets(dt);
        updateOrbs(dt);
        updateParticles(dt);
        updateTexts(dt);
        updateBossBar();

        if (p.hp <= 0) {
          endScreen(false);
        }
      }

      function startWave(n) {
        G.wave = n;
        G.waveActive = true;
        G.spawnQueue = buildWave(n);
        G.spawnTimer = 0.35;
        if (n % 10 === 0) {
          G.shake = 14;
        } else {
          showCenterMsg("Волна " + n, 1.0);
        }
        updateHUD();
      }

      function nearestEnemy(x, y, maxD) {
        let best = null,
          bd = maxD * maxD;
        for (const e of G.enemies) {
          if (e.ghost) continue;
          const d = dist2(e.x, e.y, x, y);
          if (d < bd) {
            bd = d;
            best = e;
          }
        }
        if (!best) {
          for (const e of G.enemies) {
            const d = dist2(e.x, e.y, x, y);
            if (d < bd) {
              bd = d;
              best = e;
            }
          }
        }
        return best;
      }

      function shoot(p, target) {
        const base = Math.atan2(target.y - p.y, target.x - p.x);
        const n = p.multishot;
        const spread = 0.13 * (n - 1);
        for (let i = 0; i < n; i++) {
          const a =
            base +
            (n > 1 ? -spread + 2 * spread * (i / (n - 1)) : 0) +
            rnd(-0.03, 0.03);
          G.bullets.push({
            x: p.x + Math.cos(a) * 14,
            y: p.y + Math.sin(a) * 14,
            vx: Math.cos(a) * p.bulletSpeed,
            vy: Math.sin(a) * p.bulletSpeed,
            r: p.projSize,
            dmg: p.dmg,
            pierce: p.pierce,
            homing: p.homing,
            life: 2.6,
            ang: a,
            hit: [],
            explosive: p.explosive,
            freeze: p.freezeChance,
            ricochet: p.ricochet,
          });
        }
        addParticles(
          p.x + Math.cos(base) * 18,
          p.y + Math.sin(base) * 18,
          3,
          "#ff9ecb",
          { min: 30, max: 90 },
        );
        beep(720 + Math.random() * 90, 0.045, "square", 0.022, 480);
      }

      function updateEnemies(dt) {
        const p = G.player;
        const arr = G.enemies;

        for (let i = arr.length - 1; i >= 0; i--) {
          const e = arr[i];
          e.t += dt;
          if (e.flash > 0) e.flash -= dt;
          if (e.hitCd > 0) e.hitCd -= dt;
          if (e.slowT > 0) e.slowT -= dt;

          const dx = p.x - e.x,
            dy = p.y - e.y;
          const d = Math.hypot(dx, dy) || 1;
          const ux = dx / d,
            uy = dy / d;

          let sp = e.speed;
          if (e.slowT > 0) sp *= 0.45;

          if (e.ranged) {
            const range = e.longRange ? 420 : 260;
            if (d < range * 0.75) sp = -sp * 0.7;
            else if (d < range) sp = 0;
            e.shootCd -= dt;
            if (e.shootCd <= 0 && d < 640) {
              enemyShoot(e, ux, uy);
              e.shootCd = e.boss
                ? rnd(1.2, 2.0)
                : e.longRange
                  ? rnd(1.4, 2.4)
                  : rnd(1.7, 2.8);
            }
          }

          if (e.charges) {
            e.chargeCd -= dt;
            if (e.chargeT > 0) {
              e.chargeT -= dt;
              sp = e.speed * 3.2;
            } else if (e.chargeCd <= 0 && d < 380) {
              e.chargeT = 0.85;
              e.chargeCd = rnd(2.5, 4.0);
              beep(240, 0.12, "sawtooth", 0.03, 480);
            }
          }

          if (e.teleports) {
            e.teleCd -= dt;
            if (e.teleCd <= 0 && d > 90) {
              e.teleCd = rnd(3, 5);
              const ang = rnd(0, TAU),
                rd = rnd(80, 180);
              addParticles(e.x, e.y, 8, "#c084fc", { min: 60, max: 180 });
              e.x = clamp(p.x + Math.cos(ang) * rd, 30, W - 30);
              e.y = clamp(p.y + Math.sin(ang) * rd, 30, H - 30);
              addParticles(e.x, e.y, 8, "#c084fc", { min: 60, max: 180 });
            }
          }

          if (e.heals) {
            e.healsTick -= dt;
            if (e.healsTick <= 0) {
              e.healsTick = 1.6;
              let healed = false;
              for (const o of G.enemies) {
                if (o === e || o.hp >= o.maxHp) continue;
                if (dist2(o.x, o.y, e.x, e.y) < 200 * 200) {
                  o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.06);
                  addParticles(o.x, o.y, 2, "#86efac", { min: 20, max: 60 });
                  healed = true;
                }
              }
              if (healed) beep(600, 0.08, "sine", 0.02, 800);
            }
          }

          if (e.summons) {
            e.summonCd -= dt;
            if (e.summonCd <= 0 && G.enemies.length < 60) {
              e.summonCd = rnd(4, 7);
              const old = G.wave;
              G.wave = Math.max(1, G.wave - 10);
              spawnEnemy(e.summons);
              G.wave = old;
              addParticles(e.x, e.y, 10, "#a78bfa", { min: 60, max: 160 });
            }
          }

          e.x += ux * sp * dt;
          e.y += uy * sp * dt;

          for (let j = i - 1; j >= 0; j--) {
            const o = arr[j];
            const ddx = o.x - e.x,
              ddy = o.y - e.y;
            const rr = e.r + o.r;
            const dd = Math.hypot(ddx, ddy) || 1;
            if (dd < rr) {
              const push = (rr - dd) * 0.5;
              const px = (ddx / dd) * push,
                py = (ddy / dd) * push;
              e.x -= px;
              e.y -= py;
              o.x += px;
              o.y += py;
            }
          }

          e.x = clamp(e.x, e.r, W - e.r);
          e.y = clamp(e.y, e.r, H - e.r);

          if (d < e.r + p.r && e.hitCd <= 0) {
            hurtPlayer(e.dmg);
            if (e.lifesteal) e.hp = Math.min(e.maxHp, e.hp + e.dmg * 0.5);
            e.hitCd = 0.7;
          }
        }
      }

      function enemyShoot(e, ux, uy) {
        const speed = e.longRange ? 320 : 210;
        const n = e.boss ? 5 : e.longRange ? 1 : 1;
        const base = Math.atan2(uy, ux);
        for (let i = 0; i < n; i++) {
          const a = base + (n > 1 ? (i - (n - 1) / 2) * 0.28 : 0);
          G.ebullets.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            r: e.boss ? 10 : 7,
            dmg: e.dmg * 0.8,
            life: 3.4,
            t: 0,
          });
        }
        beep(180, 0.09, "square", 0.03, 120);
      }

      function damageEnemy(e, dmg, isCrit) {
        if (!e || e.hp <= 0) return;
        let final = dmg;
        if (e.armor) final *= 1 - e.armor;
        if (e.ghost) final *= 0.7;

        if (e.shield > 0) {
          const absorbed = Math.min(e.shield, final);
          e.shield -= absorbed;
          final -= absorbed;
          if (e.shield < 0) e.shield = 0;
        }
        e.hp -= final;
        e.flash = 0.1;

        if (isCrit)
          addText(e.x, e.y - e.r - 6, Math.round(final), "#ffe066", 20);
        addParticles(e.x, e.y, 2, e.color, { min: 40, max: 120, heart: true });

        if (e.hp <= 0) killEnemy(e);
      }

      function killEnemy(e) {
        const i = G.enemies.indexOf(e);
        if (i < 0) return;
        G.enemies.splice(i, 1);
        G.kills++;
        G.score += e.score;

        if (G.boss === e) {
          G.boss = null;
        }

        addParticles(e.x, e.y, e.boss ? 40 : 10, e.color, {
          min: 60,
          max: e.boss ? 340 : 200,
          heart: true,
        });
        addParticles(e.x, e.y, e.boss ? 24 : 6, "#ff8fc4", {
          min: 50,
          max: 260,
          heart: true,
        });

        if (e.explodes) {
          G.shake = Math.max(G.shake, 8);
          const R = 90;
          const p = G.player;
          if (dist2(p.x, p.y, e.x, e.y) < R * R) hurtPlayer(e.dmg * 1.4 + 8);
          addParticles(e.x, e.y, 22, "#fb923c", { min: 100, max: 320 });
          beep(120, 0.25, "sawtooth", 0.06, 60);
        }

        if (e.splitInto && G.enemies.length < 60) {
          for (let k = 0; k < 2; k++) {
            const old = G.wave;
            G.wave = Math.max(1, G.wave - 5);
            const a = rnd(0, TAU);
            const x = clamp(e.x + Math.cos(a) * 20, 20, W - 20);
            const y = clamp(e.y + Math.sin(a) * 20, 20, H - 20);
            const base = ENEMY_TYPES[e.splitInto];
            const hpScale = 1 + (old - 1) * 0.35 + Math.pow(old / 10, 2.0);
            const hp = base.hp * hpScale;
            G.enemies.push({
              type: e.splitInto,
              x,
              y,
              r: base.r,
              color: base.color,
              spikes: base.spikes,
              hp,
              maxHp: hp,
              shield: 0,
              maxShield: 0,
              speed: base.speed,
              dmg: base.dmg,
              xp: base.xp,
              score: base.score,
              ranged: false,
              longRange: false,
              boss: false,
              bossName: "",
              explodes: false,
              splitInto: null,
              heals: false,
              healsTick: 0,
              charges: false,
              chargeCd: 0,
              chargeT: 0,
              ghost: false,
              teleports: false,
              teleCd: 0,
              armor: 0,
              lifesteal: false,
              summons: null,
              summonCd: 0,
              shootCd: 0,
              hitCd: 0,
              t: rnd(0, 10),
              flash: 0,
              slowT: 0,
            });
            G.wave = old;
          }
        }

        const orbs = e.boss ? 18 : e.type === "brute" ? 3 : 1;
        for (let k = 0; k < orbs; k++) {
          const a = rnd(0, TAU),
            s = rnd(30, 120);
          G.orbs.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            r: 6,
            val: e.xp / orbs,
            t: 0,
          });
        }

        if (e.boss) {
          G.shake = 22;
          beep(110, 0.5, "triangle", 0.09, 60);
          showCenterMsg("💥 " + (e.bossName || "БОСС") + " ПАЛ!", 1.8);
        } else {
          beep(380, 0.07, "triangle", 0.028, 200);
        }
      }

      function hurtPlayer(dmg) {
        const p = G.player;
        if (p.iframe > 0) return;
        if (p.dodge > 0 && Math.random() < p.dodge) {
          addText(p.x, p.y - 30, "промах!", "#a5f3fc", 16);
          p.iframe = 0.35;
          return;
        }
        const final = dmg * (1 - p.armor);
        p.hp -= final;
        p.iframe = 0.75;
        p.hurtFlash = 0.35;
        G.shake = Math.max(G.shake, 9);
        addParticles(p.x, p.y, 8, "#ff5c8a", {
          min: 60,
          max: 200,
          heart: true,
        });
        beep(150, 0.16, "sawtooth", 0.05, 70);
        updateHUD();
      }

      function updateBullets(dt) {
        const p = G.player;
        for (let i = G.bullets.length - 1; i >= 0; i--) {
          const b = G.bullets[i];
          b.life -= dt;

          if (b.homing > 0) {
            const t = nearestEnemy(b.x, b.y, 380);
            if (t) {
              const want = Math.atan2(t.y - b.y, t.x - b.x);
              let diff = ((want - b.ang + Math.PI * 3) % TAU) - Math.PI;
              b.ang += clamp(diff, -b.homing * dt, b.homing * dt);
              const sp = Math.hypot(b.vx, b.vy);
              b.vx = Math.cos(b.ang) * sp;
              b.vy = Math.sin(b.ang) * sp;
            }
          }

          b.x += b.vx * dt;
          b.y += b.vy * dt;

          let bounced = false;
          if (b.ricochet > 0) {
            if (b.x < b.r && b.vx < 0) {
              b.vx = -b.vx;
              b.ang = Math.atan2(b.vy, b.vx);
              b.ricochet--;
              bounced = true;
            }
            if (b.x > W - b.r && b.vx > 0) {
              b.vx = -b.vx;
              b.ang = Math.atan2(b.vy, b.vx);
              b.ricochet--;
              bounced = true;
            }
            if (b.y < b.r && b.vy < 0) {
              b.vy = -b.vy;
              b.ang = Math.atan2(b.vy, b.vx);
              b.ricochet--;
              bounced = true;
            }
            if (b.y > H - b.r && b.vy > 0) {
              b.vy = -b.vy;
              b.ang = Math.atan2(b.vy, b.vx);
              b.ricochet--;
              bounced = true;
            }
          }
          if (
            !bounced &&
            (b.life <= 0 ||
              b.x < -50 ||
              b.x > W + 50 ||
              b.y < -50 ||
              b.y > H + 50)
          ) {
            G.bullets.splice(i, 1);
            continue;
          }

          let dead = false;
          for (const e of G.enemies) {
            if (b.hit.includes(e)) continue;
            const rr = b.r + e.r;
            if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
              let dmg = b.dmg;
              const crit = Math.random() < p.crit;
              if (crit) dmg *= p.critMult;
              damageEnemy(e, dmg, crit);
              if (p.lifesteal > 0)
                p.hp = Math.min(p.maxHp, p.hp + dmg * p.lifesteal);
              if (b.freeze > 0 && Math.random() < b.freeze && e.hp > 0)
                e.slowT = 1.8;

              if (b.explosive > 0) {
                const R = 55 + b.explosive * 12;
                const R2 = R * R;
                for (const o of G.enemies) {
                  if (o === e) continue;
                  if (dist2(o.x, o.y, e.x, e.y) < R2 + o.r * o.r) {
                    damageEnemy(o, dmg * 0.5, false);
                  }
                }
                addParticles(e.x, e.y, 8, "#fbbf24", { min: 80, max: 220 });
              }

              b.hit.push(e);
              addParticles(b.x, b.y, 4, "#ffb3dd", {
                min: 40,
                max: 150,
                heart: true,
              });
              if (b.pierce > 0) b.pierce--;
              else {
                dead = true;
                break;
              }
            }
          }
          if (dead) G.bullets.splice(i, 1);
        }
      }

      function updateEBullets(dt) {
        const p = G.player;
        for (let i = G.ebullets.length - 1; i >= 0; i--) {
          const b = G.ebullets[i];
          b.t += dt;
          b.life -= dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (
            b.life <= 0 ||
            b.x < -50 ||
            b.x > W + 50 ||
            b.y < -50 ||
            b.y > H + 50
          ) {
            G.ebullets.splice(i, 1);
            continue;
          }
          const rr = b.r + p.r;
          if (dist2(b.x, b.y, p.x, p.y) < rr * rr) {
            hurtPlayer(b.dmg);
            addParticles(b.x, b.y, 6, "#e11d48", { min: 50, max: 160 });
            G.ebullets.splice(i, 1);
          }
        }
      }

      function updateOrbs(dt) {
        const p = G.player;
        const m2 = p.magnet * p.magnet;
        for (let i = G.orbs.length - 1; i >= 0; i--) {
          const o = G.orbs[i];
          o.t += dt;
          const d2 = dist2(o.x, o.y, p.x, p.y);
          if (d2 < m2) {
            const d = Math.sqrt(d2) || 1;
            const pull = 520 / Math.max(d, 30);
            o.vx += ((p.x - o.x) / d) * pull * 60 * dt;
            o.vy += ((p.y - o.y) / d) * pull * 60 * dt;
          }
          o.vx *= 0.94;
          o.vy *= 0.94;
          o.x += o.vx * dt;
          o.y += o.vy * dt;
          o.x = clamp(o.x, 6, W - 6);
          o.y = clamp(o.y, 6, H - 6);

          if (d2 < (p.r + 14) * (p.r + 14)) {
            G.orbs.splice(i, 1);
            gainXp(o.val * p.xpMult);
            addParticles(o.x, o.y, 2, "#c084fc", { min: 20, max: 70 });
          }
        }
      }

      function gainXp(v) {
        const p = G.player;
        p.xp += v;
        while (p.xp >= p.xpNext) {
          p.xp -= p.xpNext;
          p.level++;
          p.xpNext = Math.round(
            5 + (p.level - 1) * 3.0 + Math.pow(p.level, 1.2) * 0.7,
          );
          G.pendingLevels++;
        }
        updateHUD();
        if (G.pendingLevels > 0 && G.state === "playing") openUpgrade();
      }

      function updateParticles(dt) {
        for (let i = G.parts.length - 1; i >= 0; i--) {
          const q = G.parts[i];
          q.life -= dt;
          if (q.life <= 0) {
            G.parts.splice(i, 1);
            continue;
          }
          q.x += q.vx * dt;
          q.y += q.vy * dt;
          q.vx *= 0.93;
          q.vy *= 0.93;
          q.rot += dt * 3;
        }
      }
      function updateTexts(dt) {
        for (let i = G.texts.length - 1; i >= 0; i--) {
          const t = G.texts[i];
          t.life -= dt;
          t.y -= 42 * dt;
          if (t.life <= 0) G.texts.splice(i, 1);
        }
      }

      const hpFill = document.getElementById("hpFill");
      const hpText = document.getElementById("hpText");
      const xpFill = document.getElementById("xpFill");
      const xpText = document.getElementById("xpText");
      const waveNum = document.getElementById("waveNum");
      const scoreVal = document.getElementById("scoreVal");
      const killCount = document.getElementById("killCount");
      const bossBarEl = document.getElementById("bossBar");
      const bossFillEl = document.getElementById("bossFill");
      const bossNameEl = document.getElementById("bossName");

      function updateHUD() {
        const p = G.player;
        if (!p) return;
        const hpPct = clamp(p.hp / p.maxHp, 0, 1) * 100;
        hpFill.style.width = hpPct + "%";
        hpText.textContent =
          Math.max(0, Math.ceil(p.hp)) + " / " + Math.round(p.maxHp);
        xpFill.style.width = clamp(p.xp / p.xpNext, 0, 1) * 100 + "%";
        xpText.textContent = "Ур. " + p.level;
        waveNum.textContent = Math.max(1, G.wave) + "/" + CONFIG.maxWave;
        scoreVal.textContent = G.score.toLocaleString("ru-RU");
        killCount.textContent = "💀 " + G.kills;
      }

      function updateBossBar() {
        if (G.boss && G.boss.hp > 0) {
          bossBarEl.classList.add("show");
          bossNameEl.textContent = G.boss.bossName || "BOSS";
          bossFillEl.style.width =
            clamp(G.boss.hp / G.boss.maxHp, 0, 1) * 100 + "%";
        } else {
          bossBarEl.classList.remove("show");
        }
      }

      const bgHearts = [];
      for (let i = 0; i < 18; i++) {
        bgHearts.push({
          x: Math.random(),
          y: Math.random(),
          s: rnd(4, 13),
          a: rnd(0.04, 0.13),
          sp: rnd(0.006, 0.028),
          ph: rnd(0, TAU),
        });
      }

      function heartPath(c, x, y, s) {
        c.beginPath();
        c.moveTo(x, y + s * 0.72);
        c.bezierCurveTo(
          x + s * 1.45,
          y - s * 0.22,
          x + s * 0.52,
          y - s * 1.12,
          x,
          y - s * 0.34,
        );
        c.bezierCurveTo(
          x - s * 0.52,
          y - s * 1.12,
          x - s * 1.45,
          y - s * 0.22,
          x,
          y + s * 0.72,
        );
        c.closePath();
      }

      function drawBackground(dt) {
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "rgba(255,180,230,.042)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        const gs = 64;
        for (let x = 0; x < W; x += gs) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
        }
        for (let y = 0; y < H; y += gs) {
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
        }
        ctx.stroke();

        for (const h of bgHearts) {
          h.y -= h.sp * dt;
          if (h.y < -0.06) {
            h.y = 1.06;
            h.x = Math.random();
          }
          const px = h.x * W + Math.sin(G.t * 0.7 + h.ph) * 18;
          const py = h.y * H;
          ctx.globalAlpha = h.a;
          ctx.fillStyle = "#ff9ecb";
          heartPath(ctx, px, py, h.s);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawAura() {
        const p = G.player;
        if (!p || p.auraR <= 0) return;
        const pulse = 1 + Math.sin(p.auraPulse) * 0.035;
        const R = p.auraR * pulse;
        const g = ctx.createRadialGradient(p.x, p.y, R * 0.25, p.x, p.y, R);
        g.addColorStop(0, "rgba(255,140,200,.10)");
        g.addColorStop(0.7, "rgba(200,120,255,.10)");
        g.addColorStop(1, "rgba(200,120,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, R, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,170,220,.28)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, R, 0, TAU);
        ctx.stroke();
      }

      function drawOrbs() {
        for (const o of G.orbs) {
          const pulse = 1 + Math.sin(o.t * 9) * 0.15;
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.scale(pulse, pulse);
          ctx.fillStyle = "#d8b4fe";
          ctx.shadowColor = "#c084fc";
          ctx.shadowBlur = 12;
          heartPath(ctx, 0, 0, 6);
          ctx.fill();
          ctx.restore();
        }
        ctx.shadowBlur = 0;
      }

      function lighten(hex) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.min(255, ((n >> 16) & 255) + 70);
        const g = Math.min(255, ((n >> 8) & 255) + 70);
        const b = Math.min(255, (n & 255) + 70);
        return `rgb(${r},${g},${b})`;
      }

      function drawEnemies() {
        for (const e of G.enemies) {
          ctx.save();
          ctx.translate(e.x, e.y);

          const flash = e.flash > 0;
          const col = flash ? "#ffffff" : e.color;
          const alpha = e.ghost ? 0.55 : 1;
          ctx.globalAlpha = alpha;

          if (e.shield > 0) {
            ctx.strokeStyle = "rgba(96,165,250,.85)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.45, 0, TAU);
            ctx.stroke();
            ctx.strokeStyle = "rgba(191,219,254,.4)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.55, 0, TAU);
            ctx.stroke();
          }

          ctx.fillStyle = col;
          ctx.beginPath();
          const n = e.spikes;
          for (let i = 0; i < n; i++) {
            const a1 = (i / n) * TAU + e.t * 0.55;
            const a2 = ((i + 0.5) / n) * TAU + e.t * 0.55;
            ctx.lineTo(Math.cos(a1) * e.r * 0.98, Math.sin(a1) * e.r * 0.98);
            ctx.lineTo(Math.cos(a2) * e.r * 1.36, Math.sin(a2) * e.r * 1.36);
          }
          ctx.closePath();
          ctx.globalAlpha = alpha * 0.85;
          ctx.fill();
          ctx.globalAlpha = alpha;

          const grad = ctx.createRadialGradient(
            -e.r * 0.3,
            -e.r * 0.3,
            e.r * 0.15,
            0,
            0,
            e.r,
          );
          grad.addColorStop(0, flash ? "#fff" : lighten(e.color));
          grad.addColorStop(1, col);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, e.r, 0, TAU);
          ctx.fill();

          const eyeY = -e.r * 0.08;
          const eyeX = e.r * 0.34;
          ctx.fillStyle = "rgba(15,4,25,.92)";
          ctx.beginPath();
          ctx.arc(-eyeX, eyeY, e.r * 0.15, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(eyeX, eyeY, e.r * 0.15, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.8)";
          ctx.beginPath();
          ctx.arc(-eyeX + e.r * 0.05, eyeY - e.r * 0.06, e.r * 0.05, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(eyeX + e.r * 0.05, eyeY - e.r * 0.06, e.r * 0.05, 0, TAU);
          ctx.fill();

          if (e.boss) {
            ctx.fillStyle = "#ffd166";
            ctx.strokeStyle = "#b8860b";
            ctx.lineWidth = 2;
            ctx.beginPath();
            const cy = -e.r * 1.05,
              cw = e.r * 0.9;
            ctx.moveTo(-cw, cy);
            ctx.lineTo(-cw * 0.6, cy - e.r * 0.5);
            ctx.lineTo(-cw * 0.2, cy - e.r * 0.12);
            ctx.lineTo(0, cy - e.r * 0.62);
            ctx.lineTo(cw * 0.2, cy - e.r * 0.12);
            ctx.lineTo(cw * 0.6, cy - e.r * 0.5);
            ctx.lineTo(cw, cy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          ctx.globalAlpha = 1;

          if (!e.boss && e.hp < e.maxHp) {
            const bw = e.r * 2.1,
              bh = 4;
            const bx = -bw / 2,
              by = -e.r * 1.55;
            ctx.fillStyle = "rgba(0,0,0,.5)";
            ctx.fillRect(bx, by, bw, bh);
            ctx.fillStyle = e.color;
            ctx.fillRect(bx, by, bw * clamp(e.hp / e.maxHp, 0, 1), bh);
            if (e.maxShield > 0 && e.shield > 0) {
              ctx.fillStyle = "#60a5fa";
              ctx.fillRect(
                bx,
                by - 3,
                bw * clamp(e.shield / e.maxShield, 0, 1),
                2,
              );
            }
          }

          if (e.slowT > 0) {
            ctx.strokeStyle = "rgba(147,197,253,.7)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.3, 0, TAU);
            ctx.stroke();
          }

          ctx.restore();
        }
      }

      function drawBullets() {
        for (const b of G.bullets) {
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(b.ang + Math.PI / 2);
          ctx.shadowColor = "#ff6fb5";
          ctx.shadowBlur = 14;
          ctx.fillStyle = b.explosive > 0 ? "#fbbf24" : "#ff9ecb";
          heartPath(ctx, 0, 0, b.r);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.65)";
          heartPath(ctx, -b.r * 0.18, -b.r * 0.2, b.r * 0.42);
          ctx.fill();
          ctx.restore();
        }
        ctx.shadowBlur = 0;
      }

      function drawEBullets() {
        for (const b of G.ebullets) {
          ctx.save();
          ctx.translate(b.x, b.y);
          const r = b.r + Math.sin(b.t * 14) * 1.2;
          ctx.shadowColor = "#e11d48";
          ctx.shadowBlur = 14;
          ctx.fillStyle = "#e11d48";
          ctx.beginPath();
          for (let i = 0; i < 7; i++) {
            const a1 = (i / 7) * TAU + b.t * 2;
            const a2 = ((i + 0.5) / 7) * TAU + b.t * 2;
            ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
            ctx.lineTo(Math.cos(a2) * r * 1.4, Math.sin(a2) * r * 1.4);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.shadowBlur = 0;
      }

      function drawPlayer() {
        const p = G.player;
        if (!p) return;
        if (p.iframe > 0 && Math.floor(p.iframe * 22) % 2 === 0) return;

        const s = p.r;
        const bob = Math.sin(p.t * 9) * (p.moving ? 2 : 0.8);

        ctx.save();
        ctx.translate(p.x, p.y + bob);
        ctx.scale(p.blink, 1);

        ctx.save();
        ctx.scale(1 / p.blink, 1);
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.beginPath();
        ctx.ellipse(0, s * 1.25 - bob, s * 0.95, s * 0.32, 0, 0, TAU);
        ctx.fill();
        ctx.restore();

        const tw = Math.sin(p.t * 5) * 7;
        ctx.strokeStyle = "#f7a8d0";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-s * 0.7, s * 0.45);
        ctx.quadraticCurveTo(-s * 2.1, s * 0.3 + tw, -s * 1.75, -s * 0.75 + tw);
        ctx.stroke();

        ctx.fillStyle = "#fff3f9";
        ctx.strokeStyle = "#f7a8d0";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-s * 0.72, -s * 0.62);
        ctx.lineTo(-s * 0.92, -s * 1.52);
        ctx.lineTo(-s * 0.12, -s * 0.92);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s * 0.72, -s * 0.62);
        ctx.lineTo(s * 0.92, -s * 1.52);
        ctx.lineTo(s * 0.12, -s * 0.92);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffb8d9";
        ctx.beginPath();
        ctx.moveTo(-s * 0.66, -s * 0.72);
        ctx.lineTo(-s * 0.78, -s * 1.22);
        ctx.lineTo(-s * 0.3, -s * 0.86);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(s * 0.66, -s * 0.72);
        ctx.lineTo(s * 0.78, -s * 1.22);
        ctx.lineTo(s * 0.3, -s * 0.86);
        ctx.closePath();
        ctx.fill();

        const g = ctx.createRadialGradient(
          -s * 0.3,
          -s * 0.35,
          s * 0.15,
          0,
          0,
          s * 1.1,
        );
        g.addColorStop(0, "#ffffff");
        g.addColorStop(1, "#ffe4f0");
        ctx.fillStyle = g;
        ctx.strokeStyle = "#f7a8d0";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, s, 0, TAU);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(255,150,190,.42)";
        ctx.beginPath();
        ctx.ellipse(-s * 0.58, s * 0.22, s * 0.24, s * 0.16, 0, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(s * 0.58, s * 0.22, s * 0.24, s * 0.16, 0, 0, TAU);
        ctx.fill();

        const blink = Math.sin(p.t * 1.7) > 0.985 ? 0.12 : 1;
        ctx.fillStyle = "#3a1d33";
        ctx.beginPath();
        ctx.ellipse(-s * 0.33, -s * 0.1, s * 0.13, s * 0.17 * blink, 0, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(s * 0.33, -s * 0.1, s * 0.13, s * 0.17 * blink, 0, 0, TAU);
        ctx.fill();
        if (blink > 0.5) {
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(-s * 0.29, -s * 0.16, s * 0.05, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(s * 0.37, -s * 0.16, s * 0.05, 0, TAU);
          ctx.fill();
        }

        ctx.fillStyle = "#ff7ab0";
        ctx.beginPath();
        ctx.moveTo(0, s * 0.14);
        ctx.lineTo(-s * 0.11, s * 0.03);
        ctx.lineTo(s * 0.11, s * 0.03);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#c96b96";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(-s * 0.1, s * 0.2, s * 0.13, 0, Math.PI);
        ctx.arc(s * 0.1, s * 0.2, s * 0.13, 0, Math.PI);
        ctx.stroke();

        ctx.strokeStyle = "rgba(190,120,160,.65)";
        ctx.lineWidth = 1.2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.moveTo(-s * 0.5, s * 0.1 + i * s * 0.13);
          ctx.lineTo(-s * 1.25, s * 0.04 + i * s * 0.24);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(s * 0.5, s * 0.1 + i * s * 0.13);
          ctx.lineTo(s * 1.25, s * 0.04 + i * s * 0.24);
          ctx.stroke();
        }

        ctx.fillStyle = "rgba(255,120,180,.55)";
        heartPath(ctx, 0, s * 0.62, s * 0.22);
        ctx.fill();

        ctx.restore();

        if (p.hurtFlash > 0) {
          ctx.fillStyle = `rgba(255,60,120,${p.hurtFlash * 0.6})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, s * 1.6, 0, TAU);
          ctx.fill();
        }
      }

      function drawParticles() {
        for (const q of G.parts) {
          const a = clamp(q.life / q.max, 0, 1);
          ctx.globalAlpha = a;
          if (q.heart) {
            ctx.save();
            ctx.translate(q.x, q.y);
            ctx.rotate(q.rot);
            ctx.fillStyle = q.color;
            heartPath(ctx, 0, 0, q.r);
            ctx.fill();
            ctx.restore();
          } else {
            ctx.fillStyle = q.color;
            ctx.beginPath();
            ctx.arc(q.x, q.y, q.r * a, 0, TAU);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawTexts() {
        ctx.textAlign = "center";
        for (const t of G.texts) {
          const a = clamp(t.life / t.max, 0, 1);
          ctx.globalAlpha = a;
          ctx.font = `900 ${t.size}px Nunito, sans-serif`;
          ctx.fillStyle = t.color;
          ctx.strokeStyle = "rgba(0,0,0,.6)";
          ctx.lineWidth = 3;
          ctx.strokeText(t.str, t.x, t.y);
          ctx.fillText(t.str, t.x, t.y);
        }
        ctx.globalAlpha = 1;
        ctx.textAlign = "left";
      }

      function render(dt) {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        if (G.shake > 0.4) {
          ctx.translate(
            rnd(-G.shake, G.shake) * 0.35,
            rnd(-G.shake, G.shake) * 0.35,
          );
        }

        drawBackground(dt);
        drawAura();
        drawOrbs();
        drawEnemies();
        drawBullets();
        drawEBullets();
        if (G.player && G.state !== "menu") drawPlayer();
        drawParticles();
        drawTexts();

        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);
      }

      let lastT = performance.now();
      function loop(now) {
        let dt = (now - lastT) / 1000;
        lastT = now;
        dt = Math.min(dt, 0.05);

        if (G.state === "playing") update(dt);
        else {
          G.t += dt;
          if (G.msgTimer > 0) {
            G.msgTimer -= dt;
            if (G.msgTimer <= 0)
              document.getElementById("centerMsg").classList.remove("show");
          }
        }

        render(dt);
        if (G.state === "playing") updateHUD();

        requestAnimationFrame(loop);
      }

      resize();
      showMenu();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
