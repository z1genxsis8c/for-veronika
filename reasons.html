         REASONS · только специфика страницы
         ============================================================ */

      .hero-sub {
        max-width: 44ch;
      }

      /* ============================================================
         READER
         ============================================================ */
      .reader {
        margin-top: 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* --- Reader top index --- */
      .reader-index {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin-bottom: 32px;
        font-family: var(--font-serif);
        font-style: italic;
        color: var(--ink-3);
        font-size: 15px;
        letter-spacing: 0.02em;
      }

      .reader-index .current {
        font-size: 44px;
        font-style: normal;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
        line-height: 1;
        letter-spacing: -0.02em;
        transition: color 0.4s;
        display: inline-block;
        min-width: 66px;
        text-align: right;
      }

      .reader-index .sep {
        color: var(--ink-4);
        font-size: 22px;
      }

      .reader-index .total {
        font-size: 22px;
        font-style: normal;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }

      /* --- Card stage --- */
      .stage {
        position: relative;
        width: 100%;
        max-width: 520px;
        min-height: 400px;
        perspective: 1400px;
      }

      .card-slide {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        opacity: 0;
        transform: translateX(6%) scale(0.96);
        transition:
          transform 0.75s var(--ease),
          opacity 0.55s var(--ease);
        pointer-events: none;
        will-change: transform, opacity;
      }

      .card-slide.active {
        opacity: 1;
        transform: translateX(0) scale(1);
        pointer-events: auto;
      }

      .card-slide.prev {
        opacity: 0;
        transform: translateX(-6%) scale(0.96);
      }

      .card-slide.next {
        opacity: 0;
        transform: translateX(6%) scale(0.96);
      }

      /* --- Reason card --- */
      .reason-card {
        position: relative;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 44px 44px 32px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 30px 60px rgba(30, 26, 22, 0.1),
          0 10px 24px rgba(30, 26, 22, 0.05);
        display: flex;
        flex-direction: column;
        min-height: 400px;
      }

      .reason-card::after {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(30, 26, 22, 0.05);
        border-radius: 3px;
        pointer-events: none;
      }

      .reason-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 18px;
        margin-bottom: 32px;
        border-bottom: 1px solid var(--line);
        position: relative;
        z-index: 1;
      }

      .reason-label {
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .reason-num {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 16px;
        color: var(--rose-deep);
        letter-spacing: 0.02em;
      }

      .reason-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px 0 24px;
        position: relative;
        z-index: 1;
      }

      .reason-emoji {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--rose-tint), var(--surface-2));
        border: 1px solid rgba(143, 100, 114, 0.14);
        font-size: 38px;
        line-height: 1;
        margin-bottom: 32px;
        filter: saturate(0.75) brightness(1.02);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 6px 16px rgba(30, 26, 22, 0.05);
        animation: bob 4s ease-in-out infinite;
        flex-shrink: 0;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      .reason-text {
        font-family: var(--font-serif);
        font-weight: 400;
        font-size: clamp(22px, 2.4vw, 28px);
        line-height: 1.3;
        letter-spacing: -0.015em;
        color: var(--ink);
        margin: 0;
        max-width: 22ch;
        text-wrap: balance;
      }

      .reason-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-3);
        position: relative;
        z-index: 1;
      }

      .reason-foot .heart {
        color: var(--rose-deep);
        font-size: 13px;
        filter: saturate(0.85);
        letter-spacing: 0;
      }

      /* --- Progress bar --- */
      .progress-line {
        width: 100%;
        max-width: 520px;
        height: 1px;
        background: var(--line-2);
        border-radius: 1px;
        margin-top: 40px;
        position: relative;
        overflow: hidden;
      }

      .progress-line-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--rose-deep);
        border-radius: 1px;
        transition: width 0.6s var(--ease);
        width: 1%;
      }

      /* --- Index strip (tiny ticks) --- */
      .index-strip {
        display: flex;
        gap: 2px;
        align-items: flex-end;
        height: 22px;
        padding: 0;
        width: 100%;
        max-width: 520px;
        margin-top: 20px;
        overflow: hidden;
      }

      .index-tick {
        flex: 1;
        min-width: 0;
        height: 6px;
        background: var(--line-2);
        border: none;
        padding: 0;
        cursor: pointer;
        border-radius: 1px;
        transition:
          height 0.25s var(--ease),
          background 0.25s var(--ease);
        -webkit-tap-highlight-color: transparent;
      }

      .index-tick:hover {
        background: var(--rose);
        height: 12px;
      }

      .index-tick.visited {
        background: var(--rose-soft);
      }

      .index-tick.active {
        background: var(--rose-deep);
        height: 20px;
      }

      /* --- Controls --- */
      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 520px;
        margin-top: 44px;
        gap: 20px;
      }

      .arrow-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid var(--line-2);
        color: var(--ink-2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s var(--ease);
        -webkit-tap-highlight-color: transparent;
        flex-shrink: 0;
      }

      .arrow-btn svg {
        width: 18px;
        height: 18px;
        transition: transform 0.3s var(--ease);
      }

      .arrow-btn:hover:not(:disabled) {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
        transform: scale(1.06);
      }

      .arrow-btn:hover:not(:disabled) svg {
        transform: scale(1.08);
      }

      .arrow-btn:active:not(:disabled) {
        transform: scale(0.96);
      }

      .arrow-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .controls-meta {
        flex: 1;
        text-align: center;
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 14px;
        color: var(--ink-3);
        letter-spacing: 0.02em;
        transition: opacity 0.3s;
        user-select: none;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* --- Swipe hint --- */
      .swipe-hint {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%) translateY(20px);
        padding: 14px 22px;
        background: var(--ink);
        color: var(--paper);
        border-radius: var(--radius-pill);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        box-shadow: 0 20px 40px rgba(30, 26, 22, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: all 0.6s var(--ease);
        z-index: 200;
        white-space: nowrap;
      }

      .swipe-hint.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ============================================================
         RESPONSIVE (только специфика страницы)
         ============================================================ */
      @media (max-width: 640px) {
        .reader {
          margin-top: 56px;
        }

        }
        .reader-index .sep {

        }
        .reader-index .total {
          font-size: 18px;
        }

        .reason-card {

        }

          padding-bottom: 14px;
          margin-bottom: 24px;
        }
        .reason-emoji {

          height: 64px;
          font-size: 32px;
          margin-bottom: 24px;
        }

        .reason-text {
          font-size: 21px;
          max-width: 20ch;
        }

        .reason-foot {
          padding-top: 14px;
          font-size: 9.5px;
        }

        .progress-line {
          margin-top: 32px;
        }

        .index-strip {
          margin-top: 16px;
          height: 18px;
        }
        .index-tick {
          height: 5px;
        }
        .index-tick.active {
          height: 16px;
        }

        .controls {
          margin-top: 36px;
          gap: 12px;
        }
        .arrow-btn {
          width: 48px;
          height: 48px;
        }
        .arrow-btn svg {
          width: 16px;
          height: 16px;
        }
        .controls-meta {
          font-size: 12.5px;
        }

        .swipe-hint {
          bottom: 20px;
          font-size: 12px;
          padding: 12px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .reason-emoji {
          animation: none;
        }
      }
    </style>
  </head>

        { emoji: "🌻", text: "Ты моё личное солнце" },
        { emoji: "🦢", text: "Ты изящна в каждом движении" },
        { emoji: "💗", text: "Ты умеешь любить тихо и глубоко" },
        { emoji: "🌙", text: "Ты мой самый уютный вечер" },
        { emoji: "🌹", text: "Ты моя роза без шипов" },
        { emoji: "🫧", text: "Ты умеешь прощать по-настоящему" },
        { emoji: "🎶", text: "Ты звучишь в моём сердце" },
        { emoji: "☕", text: "Ты — моё тёплое утро" },
        { emoji: "🍫", text: "Ты моя самая сладкая привычка" },
        { emoji: "💫", text: "С тобой я верю в чудеса" },
        { emoji: "🌷", text: "Ты моя нежность в чистом виде" },
        { emoji: "🦋", text: "Ты — моё вдохновение" },
        { emoji: "🎀", text: "Ты украшаешь всё, к чему прикасаешься" },
        { emoji: "🐱", text: "Ты мурлычешь даже когда сердишься" },
        { emoji: "💝", text: "Ты умеешь делать меня счастливым" },
        { emoji: "🪞", text: "В тебе я вижу лучшую версию себя" },
        { emoji: "🌈", text: "Ты — все цвета моей жизни" },
        { emoji: "🌠", text: "Ты моя самая заветная мечта" },
        { emoji: "💐", text: "Ты моё счастье без условий" },
        { emoji: "🫶", text: "Ты умеешь любить без остатка" },
        { emoji: "🌟", text: "Ты — моя самая красивая история" },
        { emoji: "🦋", text: "С тобой я хочу прожить всю жизнь" },
        { emoji: "💖", text: "Ты моя любовь на все времена" },
        { emoji: "🌹", text: "Ты — та самая. Единственная." },
        { emoji: "❤️", text: "И ещё много причин, но их я скажу лично" },
      ];

      // ============================================================
      // DOM
      // ============================================================
      const stage = document.getElementById("stage");
      const readerNum = document.getElementById("readerNum");
      const progressFill = document.getElementById("progressFill");
      const indexStrip = document.getElementById("indexStrip");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const controlsMeta = document.getElementById("controlsMeta");
      const swipeHint = document.getElementById("swipeHint");

      const total = REASONS.length;
      let currentIndex = 0;

      const pad2 = (n) => String(n + 1).padStart(2, "0");

      // ============================================================
      // BUILD CARDS
      // ============================================================
      function buildCards() {
        const fragment = document.createDocumentFragment();

        REASONS.forEach((reason, i) => {
          const slide = document.createElement("div");
          slide.className = "card-slide";
          slide.dataset.index = i;
          slide.innerHTML = `
          <article class="reason-card">
            <header class="reason-head">
              <span class="reason-label">Причина</span>
              <span class="reason-num">${pad2(i)}</span>
            </header>
            <div class="reason-body">
              <span class="reason-emoji">${reason.emoji}</span>
              <p class="reason-text">${reason.text}</p>
            </div>
            <footer class="reason-foot">
              <span>Для Вероники</span>
              <span class="heart">♥</span>
            </footer>
          </article>
        `;
          fragment.appendChild(slide);
        });

        stage.appendChild(fragment);
      }

      // ============================================================
      // BUILD INDEX STRIP
      // ============================================================
      function buildIndexStrip() {
        const fragment = document.createDocumentFragment();
        REASONS.forEach((_, i) => {
          const tick = document.createElement("button");
          tick.className = "index-tick";
          tick.dataset.index = i;
          tick.setAttribute("aria-label", `Причина ${i + 1}`);
          tick.addEventListener("click", () => goTo(i));
          fragment.appendChild(tick);
        });
        indexStrip.appendChild(fragment);
      }

      // ============================================================
      // UPDATE VIEW
      // ============================================================
      function updateView() {
        const slides = stage.querySelectorAll(".card-slide");
        slides.forEach((slide, i) => {
          slide.classList.remove("active", "prev", "next");
          if (i === currentIndex) slide.classList.add("active");
          else if (i < currentIndex) slide.classList.add("prev");
          else slide.classList.add("next");
        });

        readerNum.textContent = pad2(currentIndex);

        progressFill.style.width = ((currentIndex + 1) / total) * 100 + "%";

        const ticks = indexStrip.querySelectorAll(".index-tick");
        ticks.forEach((tick, i) => {
          tick.classList.toggle("active", i === currentIndex);
          tick.classList.toggle("visited", i < currentIndex);
        });

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === total - 1;

        if (currentIndex === 0) {
          controlsMeta.textContent = "Начало";
        } else if (currentIndex === total - 1) {
          controlsMeta.textContent = "Финал";
        } else {
          controlsMeta.textContent = `${pad2(currentIndex)} из 100`;
        }
      }

      // ============================================================
      // NAVIGATION
      // ============================================================
      function nextCard() {
        if (currentIndex < total - 1) {
          currentIndex++;
          updateView();
        }
      }

      function prevCard() {
        if (currentIndex > 0) {
          currentIndex--;
          updateView();
        }
      }

      function goTo(i) {
        currentIndex = Math.max(0, Math.min(total - 1, i));
        updateView();
      }

      // ============================================================
      // KEYBOARD
      // ============================================================
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") {
          e.preventDefault();
          nextCard();
        }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault();
          prevCard();
        }
      });

      // ============================================================
      // SWIPE (touch + mouse)
      // ============================================================
      let tStartX = 0,
        tStartY = 0,
        tActive = false;

      stage.addEventListener(
        "touchstart",
        (e) => {
          tStartX = e.changedTouches[0].screenX;
          tStartY = e.changedTouches[0].screenY;
          tActive = true;
        },
        { passive: true },
      );

      stage.addEventListener(
        "touchend",
        (e) => {
          if (!tActive) return;
          tActive = false;
          const dx = tStartX - e.changedTouches[0].screenX;
          const dy = tStartY - e.changedTouches[0].screenY;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
            dx > 0 ? nextCard() : prevCard();
          }
        },
        { passive: true },
      );

      let mStartX = 0,
        mDown = false;

      stage.addEventListener("mousedown", (e) => {
        mStartX = e.clientX;
        mDown = true;
        stage.style.cursor = "grabbing";
      });

      window.addEventListener("mouseup", (e) => {
        if (!mDown) return;
        mDown = false;
        stage.style.cursor = "";
        const dx = e.clientX - mStartX;
        if (dx < -70) nextCard();
        else if (dx > 70) prevCard();
      });

      // ============================================================
      // START
      // ============================================================
      buildCards();
      buildIndexStrip();
      updateView();

      const HINT_KEY = "reasons_hint_shown_v1";
      if (!sessionStorage.getItem(HINT_KEY)) {
        setTimeout(() => {
          swipeHint.classList.add("show");
          sessionStorage.setItem(HINT_KEY, "1");
          setTimeout(() => swipeHint.classList.remove("show"), 3200);
        }, 900);
      }
    </script>
  </body>
