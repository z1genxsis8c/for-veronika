  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #ffe5ec, #ffc2d1, #fba3b7);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ---------- ДОЖДЬ ИЗ СЕРДЕЧЕК ---------- */
    #hearts-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      top: -30px;
      color: #ffb3c1;
      font-size: 20px;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ---------- ВЕРХНЯЯ ПАНЕЛЬ ---------- */
    .top-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-sizing: border-box;
      background: linear-gradient(to bottom, rgba(255, 229, 236, 0.9), rgba(255, 229, 236, 0));
    }

    .top-title {
      color: #ff4d6d;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
    }

    .counter {
      background: #fff;
      color: #ff4d6d;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.25);
      border: 2px solid #ffc2d1;
    }

    /* ---------- КОНТЕЙНЕР КАРТОЧЕК ---------- */
    .cards-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 520px;
      z-index: 10;
      perspective: 1200px;
      margin: 60px 0 100px 0;
    }

    .card-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      box-sizing: border-box;
      opacity: 0;
      transform: scale(0.85) rotateY(30deg);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .card-slide.active {
      opacity: 1;
      transform: scale(1) rotateY(0deg);
      pointer-events: auto;
    }

    .card-slide.prev {
      transform: translateX(-120%) scale(0.85) rotateY(-30deg);
      opacity: 0;
    }

    .card-slide.next {
      transform: translateX(120%) scale(0.85) rotateY(30deg);
      opacity: 0;
    }

    .reason-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255, 77, 109, 0.3), inset 0 1px 0 rgba(255, 255, 255, 1);
      border: 3px solid #fff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      width: 100%;
      max-width: 420px;
      position: relative;
      overflow: hidden;
    }

    .reason-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 179, 193, 0.3) 0%, transparent 60%);
      pointer-events: none;
      animation: cardGlow 6s ease-in-out infinite;
    }

    @keyframes cardGlow {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
      50% { transform: scale(1.1) rotate(180deg); opacity: 0.3; }
    }

    .reason-number {
      display: inline-block;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      font-size: 14px;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
      letter-spacing: 1px;
      position: relative;
      z-index: 2;
    }

    .reason-emoji {
      font-size: 70px;
      display: block;
      margin-bottom: 22px;
      line-height: 1;
      animation: emojiBob 3s ease-in-out infinite;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 8px 20px rgba(255, 77, 109, 0.3));
    }

    @keyframes emojiBob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .reason-text {
      color: #ff4d6d;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 10px rgba(255, 179, 193, 0.5);
    }

    /* ---------- КНОПКИ ВНИЗУ ---------- */
    .bottom-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 100;
      background: linear-gradient(to top, rgba(255, 229, 236, 0.95), rgba(255, 229, 236, 0));
    }

    .nav-arrows {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .arrow-btn {
      background: #fff;
      color: #ff4d6d;
      border: 2px solid #ffc2d1;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 77, 109, 0.25);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      -webkit-tap-highlight-color: transparent;
    }

    .arrow-btn:hover:not(:disabled) {
      background: #ff4d6d;
      color: white;
      border-color: #ff4d6d;
      transform: scale(1.1);
      box-shadow: 0 12px 32px rgba(255, 77, 109, 0.5);
    }

    .arrow-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .arrow-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Точки-индикаторы */
    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 400px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffc2d1;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      padding: 0;
    }

    .dot.active {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      width: 24px;
      border-radius: 50px;
      box-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
    }

    .dot:hover {
      transform: scale(1.3);
    }

    /* Кнопка внизу */
    .back-btn {
      background: rgba(255, 255, 255, 0.95);
      color: #c71585;
      border: 2px solid #ffc2d1;
      font-size: 13px;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(255, 77, 109, 0.2);
      transition: all 0.3s;
      white-space: nowrap;
    }

    .back-btn:hover {
      background: #ff4d6d;
      color: white;
      border-color: #ff4d6d;
      transform: translateY(-2px);
    }

    /* ---------- ПОДСКАЗКА СВАЙПА ---------- */
    .swipe-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 16px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .swipe-hint.show {
      opacity: 1;
    }

    /* ---------- АДАПТИВ ---------- */

      .arrow-btn { width: 50px; height: 50px; font-size: 20px; }
      .top-title { font-size: 12px; }
      .counter { font-size: 12px; padding: 5px 12px; }
    }

    /* Свайп-эффект */
    .card-slide.dragging {
      transition: none;
    }
  </style>
</head>

    const wrapper = document.getElementById('cardsWrapper');
    const counter = document.getElementById('counter');

    let currentIndex = 0;
    const total = REASONS.length;

    // ---------- ГЕНЕРАЦИЯ КАРТОЧЕК ----------
    function buildCards() {
      REASONS.forEach((reason, i) => {
        const slide = document.createElement('div');
        slide.className = 'card-slide';
        slide.dataset.index = i;
        slide.innerHTML = `
          <div class="reason-card">
            <div class="reason-number">Причина №${i + 1}</div>
            <div class="reason-emoji">${reason.emoji}</div>
            <div class="reason-text">${reason.text}</div>
          </div>
        `;
        wrapper.appendChild(slide);
      });
      updateView();

      // Точки-индикаторы
      REASONS.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'dot';
        dot.dataset.index = i;
        dot.addEventListener('click', () => goTo(i));
        dotsContainer.appendChild(dot);
      });
    }

    // ---------- ОБНОВЛЕНИЕ ВИДА ----------
    function updateView() {
      const slides = document.querySelectorAll('.card-slide');
      slides.forEach((slide, i) => {
        slide.classList.remove('active', 'prev', 'next');
        if (i === currentIndex) slide.classList.add('active');
        else if (i < currentIndex) slide.classList.add('prev');
        else slide.classList.add('next');
      });

      counter.textContent = `${currentIndex + 1} / ${total}`;

      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === total - 1;

      // Кратковременно показываем сердечки при смене
      const slide = slides[currentIndex];
      if (slide) {
        const rect = slide.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        for (let i = 0; i < 6; i++) {
          setTimeout(() => spawnHeartAt(cx, cy), i * 60);
        }
      }
    }

        currentIndex++;
        updateView();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateView();
      }
    }

    function goTo(i) {
      currentIndex = Math.max(0, Math.min(total - 1, i));
      updateView();
    }

    // ---------- КЛАВИАТУРА ----------
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextCard();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevCard();
    });

    // ---------- СВАЙП ----------
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    let isDragging = false;

    wrapper.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      isDragging = true;
    }, { passive: true });

    wrapper.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
    }, { passive: true });

    wrapper.addEventListener('touchend', (e) => {
      isDragging = false;
      handleSwipe();
    }, { passive: true });

    // Мышь для десктопа (drag)
    let mouseStartX = 0;
    let mouseDown = false;

    wrapper.addEventListener('mousedown', (e) => {
      mouseStartX = e.clientX;
      mouseDown = true;
      wrapper.style.cursor = 'grabbing';
    });

    wrapper.addEventListener('mousemove', (e) => {
      if (!mouseDown) return;
    });

    wrapper.addEventListener('mouseup', (e) => {
      if (!mouseDown) return;
      mouseDown = false;
      wrapper.style.cursor = '';
      const diff = e.clientX - mouseStartX;
      if (diff < -80) nextCard();
      else if (diff > 80) prevCard();
    });

    wrapper.addEventListener('mouseleave', () => {
      mouseDown = false;
      wrapper.style.cursor = '';
    });

    // ---------- ОБРАБОТКА СВАЙПА ----------
    function handleSwipe() {
      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      // Горизонтальный свайп должен быть больше вертикального
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 50) nextCard();
        else if (diffX < -50) prevCard();
      }
    }

    // ---------- СЕРДЕЧКИ ----------
    function spawnHeartAt(x, y) {
      const heart = document.createElement('div');
      heart.textContent = ['❤️', '💖', '💗', '💕', '✨'][Math.floor(Math.random() * 5)];
      heart.style.cssText = `
        position: fixed; left: ${x}px; top: ${y}px;
        font-size: ${20 + Math.random() * 20}px;
        pointer-events: none; z-index: 2000;
        transition: all ${0.8 + Math.random() * 0.6}s cubic-bezier(0.34, 1.56, 0.64, 1);
      `;
      document.body.appendChild(heart);
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 150;
      requestAnimationFrame(() => {
        heart.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) rotate(${Math.random() * 360}deg) scale(0.3)`;
        heart.style.opacity = '0';
      });
      setTimeout(() => heart.remove(), 1500);
    }

    // Фоновый дождь из сердечек
    const container = document.getElementById('hearts-container');
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      const heartTypes = ['❤️', '💖', '💗', '💕', '🌸'];
      heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 2 + "s";
      heart.style.fontSize = Math.random() * 15 + 15 + "px";
      container.appendChild(heart);
      setTimeout(() => { heart.remove(); }, 5000);
    }
    setInterval(createHeart, 400);

    // ---------- СТАРТ ----------
    buildCards();

    // Показываем подсказку при первом заходе
    setTimeout(() => {
      swipeHint.classList.add('show');
      setTimeout(() => swipeHint.classList.remove('show'), 3000);
    }, 800);
  </script>
</body>
