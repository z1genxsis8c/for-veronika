<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>100 причин · Для Вероники</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f3ede4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Вероника">
  <link rel="apple-touch-icon" href="photos/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       TOKENS
       ============================================================ */
    :root {
      --paper:     #f3ede4;
      --paper-2:   #ece4d8;
      --surface:   #fdfaf6;
      --surface-2: #f7f0e6;

      --ink:   #1e1a16;
      --ink-2: #4a423c;
      --ink-3: #8a7f75;
      --ink-4: #b8aca1;

      --line:   rgba(30, 26, 22, 0.08);
      --line-2: rgba(30, 26, 22, 0.16);

      --rose:      #b58794;
      --rose-deep: #8f6472;
      --rose-soft: #e8d4d8;
      --rose-tint: #f2e4e7;

      --sand: #cfb8a3;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 60% at 15% -10%, rgba(232, 212, 216, 0.55), transparent 55%),
        radial-gradient(ellipse 60% 50% at 95% 15%, rgba(207, 184, 163, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 55% at 5% 105%, rgba(181, 135, 148, 0.16), transparent 60%),
        var(--paper);
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      opacity: 0.30;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.45 0 0 0 0 0.4 0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    img { max-width: 100%; display: block; }

    ::selection { background: var(--rose-soft); color: var(--rose-deep); }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(30, 26, 22, 0.12); border-radius: 10px; border: 3px solid var(--paper); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(30, 26, 22, 0.22); }

    /* ============================================================
       TOP BAR
       ============================================================ */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      background: rgba(243, 237, 228, 0.72);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid var(--line);
      font-size: 12.5px;
      letter-spacing: 0.02em;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 17px;
      line-height: 1;
      color: var(--ink);
      padding-bottom: 2px;
      transition: transform 0.4s var(--ease-spring);
    }

    .brand:hover .brand-mark {
      transform: rotate(-12deg) scale(1.05);
    }

    .brand-label {
      color: var(--ink-2);
      font-weight: 500;
    }

    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink-2);
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      transition: color 0.2s;
    }

    .topbar-meta:hover { color: var(--ink); }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-item .icon { font-size: 13px; filter: saturate(0.7); }
    .meta-sep { color: var(--ink-4); }

    /* ============================================================
       LAYOUT
       ============================================================ */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 140px 32px 80px;
    }

    /* ============================================================
       HERO
       ============================================================ */
    .hero {
      padding: 40px 0 60px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--rose-deep);
      margin-bottom: 28px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: '';
      width: 24px;
      height: 1px;
      background: var(--rose-deep);
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(38px, 5.4vw, 72px);
      line-height: 1.04;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 0 0 22px;
      max-width: 16ch;
      margin-left: auto;
      margin-right: auto;
    }

    h1 em { font-style: italic; color: var(--rose-deep); }

    .hero-sub {
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink-2);
      margin: 0 auto;
      max-width: 44ch;
      font-weight: 400;
    }

    /* ============================================================
       READER
       ============================================================ */
    .reader {
      margin-top: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Reader top index --- */
    .reader-index {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 32px;
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      color: var(--ink-3);
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .reader-index .current {
      font-size: 44px;
      font-style: normal;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      font-feature-settings: 'tnum';
      line-height: 1;
      letter-spacing: -0.02em;
      transition: color 0.4s;
      display: inline-block;
      min-width: 66px;
      text-align: right;
    }

    .reader-index .sep {
      color: var(--ink-4);
      font-size: 22px;
    }

    .reader-index .total {
      font-size: 22px;
      font-style: normal;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    /* --- Card stage --- */
    .stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      min-height: 400px;
      perspective: 1400px;
    }

    .card-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      transform: translateX(6%) scale(0.96);
      transition:
        transform 0.75s var(--ease),
        opacity 0.55s var(--ease);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .card-slide.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .card-slide.prev {
      opacity: 0;
      transform: translateX(-6%) scale(0.96);
    }

    .card-slide.next {
      opacity: 0;
      transform: translateX(6%) scale(0.96);
    }

    /* --- Reason card --- */
    .reason-card {
      position: relative;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 44px 44px 32px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 30px 60px rgba(30, 26, 22, 0.10),
        0 10px 24px rgba(30, 26, 22, 0.05);
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }

    /* Subtle inner frame */
    .reason-card::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(30, 26, 22, 0.05);
      border-radius: 3px;
      pointer-events: none;
    }

    /* Card head */
    .reason-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 1;
    }

    .reason-label {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .reason-num {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 16px;
      color: var(--rose-deep);
      letter-spacing: 0.02em;
    }

    /* Card body — center area */
    .reason-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 0 24px;
      position: relative;
      z-index: 1;
    }

    .reason-emoji {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rose-tint), var(--surface-2));
      border: 1px solid rgba(143, 100, 114, 0.14);
      font-size: 38px;
      line-height: 1;
      margin-bottom: 32px;
      filter: saturate(0.75) brightness(1.02);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 6px 16px rgba(30, 26, 22, 0.05);
      animation: bob 4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    .reason-text {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(22px, 2.4vw, 28px);
      line-height: 1.3;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin: 0;
      max-width: 22ch;
      text-wrap: balance;
    }

    /* Card foot */
    .reason-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-3);
      position: relative;
      z-index: 1;
    }

    .reason-foot .heart {
      color: var(--rose-deep);
      font-size: 13px;
      filter: saturate(0.85);
      letter-spacing: 0;
    }

    /* --- Progress bar under the stage --- */
    .progress-line {
      width: 100%;
      max-width: 520px;
      height: 1px;
      background: var(--line-2);
      border-radius: 1px;
      margin-top: 40px;
      position: relative;
      overflow: hidden;
    }

    .progress-line-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: var(--rose-deep);
      border-radius: 1px;
      transition: width 0.6s var(--ease);
      width: 1%;
    }

    /* --- Index strip (100 tiny ticks) --- */
    .index-strip {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 22px;
      padding: 0;
      width: 100%;
      max-width: 520px;
      margin-top: 20px;
      overflow: hidden;
    }

    .index-tick {
      flex: 1;
      min-width: 0;
      height: 6px;
      background: var(--line-2);
      border: none;
      padding: 0;
      cursor: pointer;
      border-radius: 1px;
      transition: height 0.25s var(--ease), background 0.25s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .index-tick:hover {
      background: var(--rose);
      height: 12px;
    }

    .index-tick.visited { background: var(--rose-soft); }

    .index-tick.active {
      background: var(--rose-deep);
      height: 20px;
    }

    /* --- Controls --- */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 520px;
      margin-top: 44px;
      gap: 20px;
    }

    .arrow-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s var(--ease);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .arrow-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s var(--ease);
    }

    .arrow-btn:hover:not(:disabled) {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
      transform: scale(1.06);
    }

    .arrow-btn:hover:not(:disabled) svg { transform: scale(1.08); }

    .arrow-btn:active:not(:disabled) { transform: scale(0.96); }

    .arrow-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .controls-meta {
      flex: 1;
      text-align: center;
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: var(--ink-3);
      letter-spacing: 0.02em;
      transition: opacity 0.3s;
      user-select: none;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Back link --- */
    .back-wrap {
      margin-top: 80px;
      padding-top: 40px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 18px 32px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: all 0.35s var(--ease);
    }

    .back-link:hover {
      background: #000;
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(30, 26, 22, 0.24);
    }

    .back-link .back-arrow {
      display: inline-block;
      transition: transform 0.4s var(--ease);
      font-size: 15px;
    }

    .back-link:hover .back-arrow { transform: translateX(-5px); }

    /* --- Swipe hint --- */
    .swipe-hint {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 22px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      box-shadow: 0 20px 40px rgba(30, 26, 22, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: all 0.6s var(--ease);
      z-index: 200;
      white-space: nowrap;
    }

    .swipe-hint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .footer {
      padding: 40px 32px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      max-width: 1240px;
      margin: 40px auto 0;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      main { padding: 120px 20px 60px; }

      .hero { padding: 20px 0 40px; }
      h1 { font-size: clamp(30px, 8vw, 46px); }

      .reader { margin-top: 56px; }

      .reader-index .current { font-size: 34px; min-width: 52px; }
      .reader-index .sep { font-size: 18px; }
      .reader-index .total { font-size: 18px; }

      .reason-card {
        padding: 32px 26px 24px;
        border-radius: 4px;
        min-height: 360px;
      }

      .reason-head { padding-bottom: 14px; margin-bottom: 24px; }
      .reason-emoji {
        width: 64px;
        height: 64px;
        font-size: 32px;
        margin-bottom: 24px;
      }

      .reason-text { font-size: 21px; max-width: 20ch; }

      .reason-foot { padding-top: 14px; font-size: 9.5px; }

      .progress-line { margin-top: 32px; }

      .index-strip { margin-top: 16px; height: 18px; }
      .index-tick { height: 5px; }
      .index-tick.active { height: 16px; }

      .controls { margin-top: 36px; gap: 12px; }
      .arrow-btn { width: 48px; height: 48px; }
      .arrow-btn svg { width: 16px; height: 16px; }
      .controls-meta { font-size: 12.5px; }

      .back-wrap { margin-top: 56px; padding-top: 32px; }
      .back-link { padding: 16px 26px; font-size: 13.5px; }

      .swipe-hint { bottom: 20px; font-size: 12px; padding: 12px 18px; }

      .topbar { padding: 16px 20px; font-size: 11.5px; }
      .brand-label { display: none; }
      .brand-mark { width: 26px; height: 26px; font-size: 15px; }
      .meta-sep { display: none; }
      .topbar-meta { gap: 10px; font-size: 11.5px; }

      .footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
        font-size: 10.5px;
        padding: 32px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="grain"></div>

  <!-- ============================================================
       TOP BAR
       ============================================================ -->
  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-mark">V</span>
      <span class="brand-label">Для Вероники</span>
    </a>
    <div class="topbar-meta" id="infoWidget" title="Нажми, чтобы обновить">
      <span class="meta-item">
        <span class="icon" id="timeIcon">☀️</span>
        <span id="timeText">--:--</span>
      </span>
      <span class="meta-sep">·</span>
      <span class="meta-item">
        <span class="icon" id="weatherIcon">🌤️</span>
        <span id="weatherText">...</span>
      </span>
    </div>
  </header>

  <main>

    <!-- ============================================================
         HERO
         ============================================================ -->
    <section class="hero">
      <span class="eyebrow">03 · Сто причин</span>
      <h1>Почему ты — <em>та самая</em></h1>
      <p class="hero-sub">
        Одна из ста причин в каждой карточке. Листай не спеша — возвращайся, если захочешь.
      </p>
    </section>

    <!-- ============================================================
         READER
         ============================================================ -->
    <section class="reader">

      <!-- Top index -->
      <div class="reader-index">
        <span class="current" id="readerNum">01</span>
        <span class="sep">/</span>
        <span class="total">100</span>
      </div>

      <!-- Card stage -->
      <div class="stage" id="stage">
        <!-- cards injected -->
      </div>

      <!-- Progress -->
      <div class="progress-line">
        <div class="progress-line-fill" id="progressFill"></div>
      </div>

      <!-- Index strip -->
      <div class="index-strip" id="indexStrip"></div>

      <!-- Controls -->
      <div class="controls">
        <button class="arrow-btn" id="prevBtn" onclick="prevCard()" aria-label="Предыдущая">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="controls-meta" id="controlsMeta">Листай в стороны</span>
        <button class="arrow-btn" id="nextBtn" onclick="nextCard()" aria-label="Следующая">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

    </section>

    <!-- ============================================================
         BACK LINK
         ============================================================ -->
    <div class="back-wrap">
      <a href="index.html" class="back-link">
        <span class="back-arrow">←</span>
        <span>Назад к приглашению</span>
      </a>
    </div>

  </main>

  <footer class="footer">
    <span>© 2026 · Вселенная для Вероники</span>
    <span>Сделано с любовью</span>
  </footer>

  <!-- Swipe hint -->
  <div class="swipe-hint" id="swipeHint">Свайпай в стороны или жми стрелки</div>

  <!-- ============================================================
       TIME + WEATHER
       ============================================================ -->
  <script>
    function updateTimeWidget() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('timeText').textContent = `${hh}:${mm}`;

      const h = now.getHours();
      let icon = '🌙';
      if      (h >= 5  && h < 12) icon = '🌅';
      else if (h >= 12 && h < 18) icon = '☀️';
      else if (h >= 18 && h < 23) icon = '🌆';
      document.getElementById('timeIcon').textContent = icon;
    }
    updateTimeWidget();
    setInterval(updateTimeWidget, 1000);

    const WEATHER_CITY = { name: 'Улан-Удэ' };

    function pickIconFromDesc(desc) {
      desc = (desc || '').toLowerCase();
      if (desc.includes('sun') || desc.includes('clear')) return '☀️';
      if (desc.includes('partly') || desc.includes('mostly sun')) return '🌤️';
      if (desc.includes('cloud') || desc.includes('overcast')) return '☁️';
      if (desc.includes('rain') || desc.includes('drizzle')) return '🌧️';
      if (desc.includes('snow') || desc.includes('sleet')) return '❄️';
      if (desc.includes('thunder') || desc.includes('storm')) return '⛈️';
      if (desc.includes('fog') || desc.includes('mist')) return '🌫️';
      return '🌤️';
    }

    function seasonalWeather() {
      const m = new Date().getMonth();
      let icon, temp;
      if (m === 11 || m === 0 || m === 1) { icon = '❄️'; temp = -18; }
      else if (m === 2 || m === 3) { icon = '🌨️'; temp = -5; }
      else if (m === 4) { icon = '🌱'; temp = 8; }
      else if (m >= 5 && m <= 7) { icon = '☀️'; temp = 24; }
      else if (m === 8) { icon = '🍂'; temp = 12; }
      else { icon = '🌧️'; temp = 2; }
      return { icon, temp };
    }

    async function loadWeather() {
      const iconEl = document.getElementById('weatherIcon');
      const textEl = document.getElementById('weatherText');
      iconEl.textContent = '⛅';
      textEl.textContent = '...';

      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        const res = await fetch(
          `https://wttr.in/${encodeURIComponent(WEATHER_CITY.name)}?format=j1`,
          { signal: ctrl.signal, cache: 'no-store' }
        );
        clearTimeout(timer);

        if (res.ok) {
          const data = await res.json();
          const cur = data.current_condition && data.current_condition[0];
          if (cur && cur.temp_C !== undefined) {
            const temp = parseInt(cur.temp_C, 10);
            const desc = cur.weatherDesc && cur.weatherDesc[0] ? cur.weatherDesc[0].value : '';
            iconEl.textContent = pickIconFromDesc(desc);
            textEl.textContent = `${temp > 0 ? '+' : ''}${temp}°C`;
            return;
          }
        }
      } catch (e) {}

      const w = seasonalWeather();
      iconEl.textContent = w.icon;
      textEl.textContent = `${w.temp > 0 ? '+' : ''}${w.temp}°C`;
    }

    loadWeather();
    setInterval(loadWeather, 30 * 60 * 1000);
    document.getElementById('infoWidget').addEventListener('click', loadWeather);
  </script>

    const total = REASONS.length;
    let currentIndex = 0;

    const pad2 = (n) => String(n + 1).padStart(2, '0');

    // ============================================================
    // BUILD CARDS
    // ============================================================
    function buildCards() {
      const fragment = document.createDocumentFragment();

      REASONS.forEach((reason, i) => {
        const slide = document.createElement('div');
        slide.className = 'card-slide';
        slide.dataset.index = i;
        slide.innerHTML = `
          <article class="reason-card">
            <header class="reason-head">
              <span class="reason-label">Причина</span>
              <span class="reason-num">${pad2(i)}</span>

    // ============================================================
    // BUILD INDEX STRIP (100 tiny ticks)
    // ============================================================
    function buildIndexStrip() {
      const fragment = document.createDocumentFragment();
      REASONS.forEach((_, i) => {
        const tick = document.createElement('button');
        tick.className = 'index-tick';
        tick.dataset.index = i;
        tick.setAttribute('aria-label', `Причина ${i + 1}`);
        tick.addEventListener('click', () => goTo(i));
        fragment.appendChild(tick);
      });
      indexStrip.appendChild(fragment);
    }

    // ============================================================
    // UPDATE VIEW
    // ============================================================
    function updateView() {
      // Slides
      const slides = stage.querySelectorAll('.card-slide');
      slides.forEach((slide, i) => {
        slide.classList.remove('active', 'prev', 'next');
        if (i === currentIndex) slide.classList.add('active');
        else if (i < currentIndex) slide.classList.add('prev');
        else slide.classList.add('next');
      });

      // Big number
      readerNum.textContent = pad2(currentIndex);

      // Progress line
      progressFill.style.width = ((currentIndex + 1) / total * 100) + '%';

      // Ticks
      const ticks = indexStrip.querySelectorAll('.index-tick');
      ticks.forEach((tick, i) => {
        tick.classList.toggle('active', i === currentIndex);
        tick.classList.toggle('visited', i < currentIndex);
      });

      // Buttons
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === total - 1;

      // Meta hint
      if (currentIndex === 0) {
        controlsMeta.textContent = 'Начало';
      } else if (currentIndex === total - 1) {
        controlsMeta.textContent = 'Финал';
      } else {
        controlsMeta.textContent = `${pad2(currentIndex)} из 100`;
      }
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function nextCard() {
      if (currentIndex < total - 1) {
        currentIndex++;
        updateView();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateView();
      }
    }

    function goTo(i) {
      currentIndex = Math.max(0, Math.min(total - 1, i));
      updateView();
    }

    // ============================================================
    // KEYBOARD
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        nextCard();
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        prevCard();
      }
    });

    // ============================================================
    // SWIPE (touch + mouse)
    // ============================================================
    let tStartX = 0, tStartY = 0, tActive = false;

    stage.addEventListener('touchstart', (e) => {
      tStartX = e.changedTouches[0].screenX;
      tStartY = e.changedTouches[0].screenY;
      tActive = true;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      if (!tActive) return;
      tActive = false;
      const dx = tStartX - e.changedTouches[0].screenX;
      const dy = tStartY - e.changedTouches[0].screenY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
        dx > 0 ? nextCard() : prevCard();
      }
    }, { passive: true });

    let mStartX = 0, mDown = false;

    stage.addEventListener('mousedown', (e) => {
      mStartX = e.clientX;
      mDown = true;
      stage.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', (e) => {
      if (!mDown) return;
      mDown = false;
      stage.style.cursor = '';
      const dx = e.clientX - mStartX;
      if (dx < -70) nextCard();
      else if (dx > 70) prevCard();
    });

    // ============================================================
    // START
    // ============================================================
    buildCards();
    buildIndexStrip();
    updateView();

    // Swipe hint — только при первом заходе
    const HINT_KEY = 'reasons_hint_shown_v1';
    if (!sessionStorage.getItem(HINT_KEY)) {
      setTimeout(() => {
        swipeHint.classList.add('show');
        sessionStorage.setItem(HINT_KEY, '1');
        setTimeout(() => swipeHint.classList.remove('show'), 3200);
      }, 900);
    }
  </script>
