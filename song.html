<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Наша песня · Для Вероники</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f3ede4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Вероника" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" href="photos/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Единый движок -->
    <link rel="stylesheet" href="shared/tokens.css" />
    <link rel="stylesheet" href="shared/base.css" />

    <style>
      /* ============================================================
         ПЕСНЯ · только специфика страницы
         ============================================================ */

      /* Фоновые канавки винила — уникально для этой страницы */
      body::after {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        width: 160vmin;
        height: 160vmin;
        transform: translate(-50%, -50%);
        z-index: -1;
        pointer-events: none;
        border-radius: 50%;
        background: repeating-radial-gradient(
          circle at center,
          transparent 0,
          transparent 40px,
          rgba(30, 26, 22, 0.018) 40px,
          rgba(30, 26, 22, 0.018) 41px
        );
        mask-image: radial-gradient(
          circle at center,
          black 20%,
          transparent 72%
        );
        -webkit-mask-image: radial-gradient(
          circle at center,
          black 20%,
          transparent 72%
        );
      }

      .hero-sub {
        max-width: 42ch;
      }

      /* ============================================================
         PLAYER
         ============================================================ */
      .player-wrap {
        margin-top: 72px;
        display: flex;
        justify-content: center;
      }

      .player {
        position: relative;
        width: 100%;
        max-width: 520px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 32px;
        padding: 44px 40px 40px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 30px 60px rgba(30, 26, 22, 0.1),
          0 8px 20px rgba(30, 26, 22, 0.04);
      }

      /* Sleeve header */
      .sleeve-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        margin-bottom: 32px;
        border-bottom: 1px solid var(--line);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .sleeve-head .side {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 15px;
        letter-spacing: 0;
        text-transform: none;
        color: var(--rose-deep);
      }

      /* Vinyl stage */
      .vinyl-stage {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 40px;
      }
      .vinyl-wrapper {
        position: relative;
        width: 260px;
        height: 260px;
      }

      /* Vinyl disc */
      .vinyl {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
          conic-gradient(
            from 30deg,
            rgba(255, 255, 255, 0.05) 0deg,
            rgba(255, 255, 255, 0.1) 25deg,
            rgba(255, 255, 255, 0.01) 80deg,
            rgba(255, 255, 255, 0.08) 140deg,
            rgba(255, 255, 255, 0.01) 200deg,
            rgba(255, 255, 255, 0.1) 260deg,
            rgba(255, 255, 255, 0.05) 330deg,
            rgba(255, 255, 255, 0.05) 360deg
          ),
          repeating-radial-gradient(
            circle at 50% 50%,
            #0c0c0c 0,
            #0c0c0c 1.5px,
            #1c1c1c 1.5px,
            #1c1c1c 3px
          );
        box-shadow:
          inset 0 0 40px rgba(0, 0, 0, 0.85),
          inset 0 0 0 3px rgba(255, 255, 255, 0.03),
          0 24px 48px rgba(30, 26, 22, 0.22),
          0 8px 16px rgba(30, 26, 22, 0.12);
        animation: spin 4s linear infinite;
        animation-play-state: paused;
        transition: box-shadow 0.5s var(--ease);
      }
      .vinyl.playing {
        animation-play-state: running;
        box-shadow:
          inset 0 0 40px rgba(0, 0, 0, 0.85),
          inset 0 0 0 3px rgba(255, 255, 255, 0.06),
          0 24px 48px rgba(30, 26, 22, 0.22),
          0 8px 24px rgba(181, 135, 148, 0.28),
          0 0 70px rgba(181, 135, 148, 0.2);
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Center label */
      .vinyl-label {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 34%;
        height: 34%;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--rose) 0%,
          var(--rose-deep) 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--paper);
        z-index: 2;
        box-shadow:
          inset 0 0 24px rgba(0, 0, 0, 0.2),
          inset 0 0 0 1px rgba(255, 255, 255, 0.15),
          0 4px 12px rgba(0, 0, 0, 0.35);
      }
      .vinyl-label svg {
        width: 26px;
        height: 26px;
        opacity: 0.9;
      }
      .vinyl-hole {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #050505;
        z-index: 3;
        box-shadow:
          inset 0 0 4px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }

      /* Tonearm */
      .tonearm {
        position: absolute;
        top: 4%;
        right: -4%;
        width: 46%;
        height: 8px;
        background: linear-gradient(
          to right,
          #d4cfc6 0%,
          #ada69c 45%,
          #857e74 100%
        );
        border-radius: 4px;
        transform-origin: right center;
        transform: rotate(-40deg);
        transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow:
          0 4px 10px rgba(30, 26, 22, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        z-index: 5;
      }
      .tonearm::before {
        content: "";
        position: absolute;
        right: -14px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 30%,
          #ece7de,
          #9a938a 70%,
          #6d6660
        );
        box-shadow:
          0 2px 6px rgba(30, 26, 22, 0.4),
          inset 0 1px 2px rgba(255, 255, 255, 0.4);
      }
      .tonearm::after {
        content: "";
        position: absolute;
        left: -8px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 14px;
        border-radius: 3px;
        background: linear-gradient(180deg, #3a342e, #1e1a16);
        box-shadow: 0 3px 6px rgba(30, 26, 22, 0.45);
      }
      .tonearm.playing {
        transform: rotate(-22deg);
      }

      /* Track info */
      .track-info {
        text-align: center;
        margin-bottom: 28px;
        min-height: 62px;
      }
      .track-title {
        font-family: var(--font-serif);
        font-weight: 400;
        font-style: italic;
        font-size: 26px;
        line-height: 1.15;
        letter-spacing: -0.015em;
        color: var(--ink);
        margin: 0 0 6px;
        transition: opacity 0.4s var(--ease);
      }
      .track-meta {
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* Progress */
      .progress-container {
        margin-bottom: 8px;
        cursor: pointer;
        padding: 10px 0;
        -webkit-tap-highlight-color: transparent;
      }
      .progress-bar {
        position: relative;
        height: 2px;
        background: var(--line-2);
        border-radius: 2px;
        transition: height 0.25s var(--ease);
      }
      .progress-container:hover .progress-bar {
        height: 4px;
      }
      .progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: var(--rose-deep);
        border-radius: 2px;
        transition: width 0.1s linear;
      }
      .progress-fill::after {
        content: "";
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--rose-deep);
        box-shadow: 0 2px 8px rgba(30, 26, 22, 0.18);
        transition: transform 0.3s var(--ease-spring);
      }
      .progress-container:hover .progress-fill::after {
        transform: translateY(-50%) scale(1);
      }
      .time-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
        margin-top: 8px;
      }

      /* Controls */
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin: 28px 0 24px;
      }
      .ctrl-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid var(--line-2);
        color: var(--ink-2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s var(--ease);
        -webkit-tap-highlight-color: transparent;
      }
      .ctrl-btn svg {
        width: 15px;
        height: 15px;
      }
      .ctrl-btn:hover {
        background: var(--surface-2);
        border-color: var(--ink-3);
        color: var(--ink);
        transform: scale(1.06);
      }
      .ctrl-btn:active {
        transform: scale(0.96);
      }
      .play-btn {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--paper);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.35s var(--ease);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.12) inset,
          0 12px 28px rgba(30, 26, 22, 0.2);
        -webkit-tap-highlight-color: transparent;
      }
      .play-btn svg {
        width: 20px;
        height: 20px;
      }
      .play-btn:hover {
        background: #000;
        transform: scale(1.05);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.12) inset,
          0 16px 36px rgba(30, 26, 22, 0.28);
      }
      .play-btn:active {
        transform: scale(0.97);
      }

      /* Volume */
      .volume-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .volume-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-2);
        width: 22px;
        height: 22px;
        transition: color 0.25s;
        cursor: pointer;
        flex-shrink: 0;
      }
      .volume-icon:hover {
        color: var(--ink);
      }
      .volume-icon svg {
        width: 18px;
        height: 18px;
      }
      .volume-slider-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        height: 20px;
      }
      .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 2px;
        border-radius: 2px;
        background: var(--line-2);
        outline: none;
        cursor: pointer;
      }
      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--rose-deep);
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(30, 26, 22, 0.2);
        transition: transform 0.2s var(--ease);
        border: 2px solid var(--surface);
      }
      .volume-slider::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }
      .volume-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 2px solid var(--surface);
        border-radius: 50%;
        background: var(--rose-deep);
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(30, 26, 22, 0.2);
      }
      .volume-value {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
        min-width: 34px;
        text-align: right;
      }

      /* Hidden audio */
      .hidden-audio {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      /* ============================================================
         RESPONSIVE (только специфика страницы)
         ============================================================ */
      @media (max-width: 560px) {
        .player-wrap {
          margin-top: 56px;
        }
        .player {
          padding: 32px 24px 28px;
          border-radius: 24px;
        }

        .sleeve-head {
          padding-bottom: 16px;
          margin-bottom: 26px;
        }

        .vinyl-wrapper {
          width: 210px;
          height: 210px;
        }
        .vinyl-stage {
          margin-bottom: 30px;
        }

        .track-title {
          font-size: 22px;
        }
        .track-info {
          margin-bottom: 22px;
        }

        .controls {
          gap: 14px;
          margin: 22px 0 20px;
        }
        .ctrl-btn {
          width: 44px;
          height: 44px;
        }
        .ctrl-btn svg {
          width: 14px;
          height: 14px;
        }
        .play-btn {
          width: 64px;
          height: 64px;
        }
        .play-btn svg {
          width: 18px;
          height: 18px;
        }

        .volume-row {
          gap: 10px;
          padding-top: 16px;
        }
        .volume-value {
          min-width: 30px;
          font-size: 10.5px;
        }
      }
    </style>
  </head>

  <body>
    <div class="grain"></div>

    <header class="topbar">
      <a href="index.html" class="brand">
        <span class="brand-mark">V</span>
        <span class="brand-label">Для Вероники</span>

      <div class="topbar-meta" id="infoWidget" title="Нажми, чтобы обновить">
        <span class="meta-item">
          <span class="icon" id="timeIcon">☀️</span>

    </header>

    <main>
      <section class="hero">
        <span class="eyebrow">02 · Музыка</span>
        <h1>Наша <em>песня</em></h1>

          почувствуй.

      </section>

      <!-- PLAYER -->
      <div class="player-wrap">

          <div class="vinyl-stage">
            <div class="vinyl-wrapper">
              <div class="tonearm" id="tonearm"></div>
              <div class="vinyl" id="vinyl">
                <div class="vinyl-label">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M9 18V5l12-2v13" />
                    <circle cx="6" cy="18" r="3" />

          <div class="track-info">

          </div>

          <div
            class="progress-container"
            id="progressContainer"
            onclick="seekByClick(event)"
          >
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-labels">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="controls">
            <button
              class="ctrl-btn"
              id="rewindBtn"
              onclick="skip(-10)"
              title="-10 секунд"
              aria-label="Назад на 10 секунд"
            >
              <svg
                viewBox="0 0 24 24"

                stroke-width="1.8"

                <polygon

            </button>

            <button
              class="play-btn"

              onclick="togglePlay()"
              title="Воспроизвести"

            >
              <svg
                id="playIcon"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <polygon points="6 4 20 12 6 20 6 4" />
              </svg>
              <svg
                id="pauseIcon"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="display: none"

              >
                <rect x="6" y="4" width="4" height="16" rx="1" />
                <rect x="14" y="4" width="4" height="16" rx="1" />
              </svg>
            </button>

            <button
              class="ctrl-btn"
              id="forwardBtn"
              onclick="skip(10)"
              title="+10 секунд"
              aria-label="Вперёд на 10 секунд"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polygon
                  points="5 4 15 12 5 20 5 4"
                  fill="currentColor"
                  stroke="none"
                />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
            </button>
          </div>

          <div class="volume-row">
            <span
              class="volume-icon"
              id="volIcon"
              onclick="toggleMute()"
              title="Выключить звук"
              aria-label="Звук"
            >
              <svg
                id="volIconSvg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polygon
                  points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"
                  fill="currentColor"
                  stroke="none"
                />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
              </svg>
            </span>

                type="range"
                class="volume-slider"
                id="volumeSlider"
                min="0"
                max="100"
                value="70"
                aria-label="Громкость"
              />
            </div>
            <span class="volume-value" id="volumeValue">70%</span>
          </div>
        </div>
      </div>

      <!-- АВТО-НАВИГАЦИЯ -->
      <nav class="auto-nav" data-nav="timer,movie,playlist"></nav>

    <!-- Логика плеера (специфика страницы) -->
    <script>
      // ============================================================
      // ⚠️ НАЗВАНИЕ ПЕСНИ
      // ============================================================
      const SONG_TITLE = "Наша песня";
      const SONG_META = "Только для тебя";

      const audio = document.getElementById("audio");
      const playBtn = document.getElementById("playBtn");
      const playIcon = document.getElementById("playIcon");
      const pauseIcon = document.getElementById("pauseIcon");
      const vinyl = document.getElementById("vinyl");
      const tonearm = document.getElementById("tonearm");
      const progressFill = document.getElementById("progressFill");
      const progressContainer = document.getElementById("progressContainer");
      const currentTimeEl = document.getElementById("currentTime");
      const durationEl = document.getElementById("duration");
      const songTitle = document.getElementById("songTitle");
      const trackMeta = document.getElementById("trackMeta");
      const volumeSlider = document.getElementById("volumeSlider");
      const volumeValue = document.getElementById("volumeValue");
      const volIconSvg = document.getElementById("volIconSvg");

      songTitle.textContent = SONG_TITLE;
      trackMeta.textContent = SONG_META;

      let isPlaying = false;
      let lastVolume = 70;

      // ---------- SVG icons для громкости ----------
      const VOL_ICONS = {
        mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>',
        low: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
        mid: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
        high: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M22 12h0"/>',
      };

      function updateVolIcon(val) {
        let key = "high";
        if (val === 0) key = "mute";
        else if (val < 33) key = "low";
        else if (val < 66) key = "mid";
        volIconSvg.innerHTML = VOL_ICONS[key];
      }

      // ---------- PLAY / PAUSE ----------
      function setPlayingUI(playing) {
        isPlaying = playing;
        if (playing) {
          playIcon.style.display = "none";
          pauseIcon.style.display = "";
          vinyl.classList.add("playing");
          tonearm.classList.add("playing");
          playBtn.setAttribute("title", "Пауза");
          playBtn.setAttribute("aria-label", "Пауза");
        } else {
          playIcon.style.display = "";
          pauseIcon.style.display = "none";
          vinyl.classList.remove("playing");
          tonearm.classList.remove("playing");
          playBtn.setAttribute("title", "Воспроизвести");
          playBtn.setAttribute("aria-label", "Воспроизвести");
        }
      }

      function togglePlay() {
        if (isPlaying) {
          audio.pause();
        } else {
          audio.play().catch((err) => {
            console.error("Ошибка воспроизведения:", err);
            trackMeta.textContent = "Файл песни не найден";
            setPlayingUI(true);
          });
        }
      }

      audio.addEventListener("play", () => setPlayingUI(true));
      audio.addEventListener("pause", () => setPlayingUI(false));
      audio.addEventListener("ended", () => setPlayingUI(false));

      // ---------- ПРОГРЕСС ----------
      function formatTime(sec) {
        if (!sec || isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = percent + "%";
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      });

      audio.addEventListener("loadedmetadata", () => {
        durationEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener("durationchange", () => {
        durationEl.textContent = formatTime(audio.duration);
      });

      // ---------- SEEK ----------
      function seekByClick(e) {
        const rect = progressContainer.getBoundingClientRect();
        const clientX =
          e.clientX !== undefined
            ? e.clientX
            : e.touches && e.touches[0]
              ? e.touches[0].clientX
              : 0;
        const x = clientX - rect.left;
        const percent = Math.max(0, Math.min(1, x / rect.width));
        if (audio.duration) {
          audio.currentTime = percent * audio.duration;
        }
      }

      // ---------- SKIP ----------
      function skip(seconds) {
        if (audio.duration) {
          audio.currentTime = Math.max(
            0,
            Math.min(audio.duration, audio.currentTime + seconds),
          );
        }
      }

      // ---------- VOLUME ----------
      audio.volume = 0.7;

      volumeSlider.addEventListener("input", (e) => {
        const val = parseInt(e.target.value);
        audio.volume = val / 100;
        volumeValue.textContent = val + "%";
        lastVolume = val;
        updateVolIcon(val);
      });

      function toggleMute() {
        if (audio.volume > 0) {
          lastVolume = volumeSlider.value;
          audio.volume = 0;
          volumeSlider.value = 0;
          volumeValue.textContent = "0%";
          updateVolIcon(0);
        } else {
          audio.volume = lastVolume / 100;
          volumeSlider.value = lastVolume;
          volumeValue.textContent = lastVolume + "%";
          updateVolIcon(lastVolume);
        }
      }

      // ---------- KEYBOARD ----------
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && e.target === document.body) {
          e.preventDefault();
          togglePlay();
        } else if (e.code === "ArrowLeft") {
          skip(-5);
        } else if (e.code === "ArrowRight") {
          skip(5);
        } else if (e.code === "ArrowUp") {
          e.preventDefault();
          audio.volume = Math.min(1, audio.volume + 0.1);
          volumeSlider.value = Math.round(audio.volume * 100);
          volumeValue.textContent = Math.round(audio.volume * 100) + "%";
          updateVolIcon(Math.round(audio.volume * 100));
        } else if (e.code === "ArrowDown") {
          e.preventDefault();
          audio.volume = Math.max(0, audio.volume - 0.1);
          volumeSlider.value = Math.round(audio.volume * 100);
          volumeValue.textContent = Math.round(audio.volume * 100) + "%";
          updateVolIcon(Math.round(audio.volume * 100));
        }
      });

      updateVolIcon(70);

      audio.addEventListener("error", () => {
        trackMeta.textContent = "Файл песни не найден";
      });
    </script>
  </body>
</html>
